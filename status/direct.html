<!doctype html>
<html lang="en" class="m3">
<head>
<meta charset="utf-8">
<script>/* H258: opened in the call page's sheet, it takes the call page's light or dark pick (?theme=); else the system decides. */ try { const t = new URLSearchParams(location.search).get("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181c">
<link rel="manifest" href="/hq.webmanifest">
<link rel="apple-touch-icon" href="/hq-icon-180.png">
<title>Direct line</title>
<!-- H80: HQ's own direct line. A chat with only her, like texting; her texts also arrive on the lock screen
     (Web Push, allowed once from inside the home-screen app). Reads /direct.json, sends with /direct/send. -->
<style>
  :root { --bg: #16181c; --panel: #1f2228; --text: #e8e9ec; --dim: #9aa0aa; --me: #16a34a; --her: #7c3aed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #2a2e36; }
  header a { color: var(--dim); text-decoration: none; font-size: 22px; padding-right: 4px; }
  #face { width: 34px; height: 34px; border-radius: 50%; background: var(--her); object-fit: cover; }
  #who { font-weight: 600; }
  #sub { color: var(--dim); font-size: 12px; }
  #bell { margin-left: auto; background: var(--her); color: #fff; border: 0; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
  #bell[hidden] { display: none; }
  /* H300: the switch to the other chat (Donna's or Moneypenny's), on the right; the bell sits after it */
  header > div { min-width: 0; }
  #who, #sub { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #swap { margin-left: auto; flex-shrink: 0; background: transparent; color: var(--text); border: 1px solid var(--dim);
    border-radius: 16px; padding: 6px 12px; font: inherit; font-size: 13px; white-space: nowrap; cursor: pointer; }
  #swap[hidden] { display: none; }
  #swap:not([hidden]) ~ #bell { margin-left: 0; }
  #pushline { padding: 6px 16px; font-size: 13px; color: var(--dim); border-bottom: 1px solid #2a2e36; }
  #pushline[hidden] { display: none; }
  #list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 80%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .m a { color: inherit; text-decoration: underline; text-underline-offset: 2px; overflow-wrap: anywhere; }
  .agent { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; border-left: 3px solid var(--her); }
  .me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 6px; }
  /* H158: a day pill between days, and each text's time in its bubble's corner, like a chat app. */
  .t { align-self: center; color: var(--dim); background: var(--panel); font-size: 12px; padding: 3px 10px;
    border-radius: 10px; margin: 10px 0 4px; }
  .m .at { float: right; color: var(--dim); font-size: 11px; margin: 6px 0 -4px 10px; white-space: nowrap; }
  .me .at { color: rgba(255, 255, 255, .75); }
  .m.quiet { opacity: .7; font-size: 13px; font-style: italic; background: transparent; box-shadow: none; }
  #typing { color: var(--dim); font-size: 13px; padding: 0 16px 6px; min-height: 18px; }
  form { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #2a2e36; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid #2a2e36;
    border-radius: 20px; padding: 9px 14px; font: inherit; max-height: 120px; }
  button[type=submit] { background: var(--her); color: #fff; border: 0; border-radius: 20px; padding: 0 16px; font: inherit; }
  #empty { color: var(--dim); text-align: center; margin-top: 30%; }
</style>
<!-- H201: Modern 3, the only look: the call page's ground and type, rounder bubbles (html.m3 is in the page itself). -->
<style>
  html.m3 { --bg:#f2f3f6; --panel:#ffffff; --text:#12161e; --dim:#5b6574; }
  @media (prefers-color-scheme: dark) { html.m3:not([data-theme=light]) { --bg:#14181f; --panel:#1a1e26; --text:#eef1f5; --dim:#8c97a8; } }
  html.m3[data-theme=dark] { --bg:#14181f; --panel:#1a1e26; --text:#eef1f5; --dim:#8c97a8; }
  html.m3 body { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif; }
  html.m3 header, html.m3 form, html.m3 textarea { border-color:rgba(127,127,127,.2); }
  html.m3 .agent { box-shadow:0 0 0 1px rgba(127,127,127,.14); }
  html.m3 .m { border-radius:20px; padding:9px 14px; }
  html.m3 textarea { border-radius:22px; }
  html.m3 button[type=submit] { border-radius:22px; }
</style>
</head>
<body>
<header>
  <a href="/hq" aria-label="Back to HQ">‹</a>
  <img id="face" alt="">
  <div><div id="who">Donna</div><div id="sub">HQ's direct line</div></div>
  <button id="swap" type="button" hidden></button>
  <button id="bell" hidden>Turn on her texts</button>
</header>
<div id="pushline" hidden></div>
<div id="list"><div id="empty">No texts yet.</div></div>
<div id="typing"></div>
<form id="f"><textarea id="in" rows="1" placeholder="Text her"></textarea><button type="submit">Send</button></form>
<script>
  // F25: also served through the call line (8443), when the phone's home-screen icon is the call page itself:
  // back goes to the call page, and the page keeps that app's manifest and icon.
  const CALL = location.port === '8443';
  // H266: Moneypenny's own line, the same page on ?line=team (her texts open it)
  const TEAM = new URLSearchParams(location.search).get('line') === 'team';
  // F29: opened in the sheet over the call page (?sheet): the sheet has its own Close, so no back arrow.
  // F102: the sheet is how the phone opens her chat, so her texts are looked after here too (below), the same frame's
  // origin as the home-screen app; only a tap asks for anything.
  const SHEET = new URLSearchParams(location.search).has('sheet');
  if (SHEET) {
    document.querySelector('header a').remove();
    document.body.style.paddingTop = '0';
  }
  // H145: inside the Mac app (?app), on its own tab: the app has the tabs and shows her texts as Mac notifications
  // itself, so no back arrow and no notification button.
  const APP = new URLSearchParams(location.search).has('app');
  if (APP) document.querySelector('header a').remove();
  if (CALL && !SHEET) document.querySelector('header a').href = '/';
  if (CALL) {
    document.querySelector('link[rel=manifest]').href = '/manifest.webmanifest';
    document.querySelector('link[rel=apple-touch-icon]').href = '/apple-touch-icon.png';
  }
(() => {
  const list = document.getElementById('list');
  const input = document.getElementById('in');
  const bell = document.getElementById('bell');
  let shown = 0, info = null, waiting = false, lineHere = '';
  // H158 begin: the day pill (Today, Yesterday, the weekday within a week, else the date) and each text's time.
  const dayKey = (t) => new Date(t * 1000).toDateString();
  const day = (t, now = Date.now() / 1000) => {
    const d = new Date(t * 1000), n = new Date(now * 1000);
    const days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
    if (days === 0) return 'Today';
    if (days === 1) return 'Yesterday';
    if (days > 1 && days < 7) return d.toLocaleDateString([], { weekday: 'long' });
    return d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short', year: d.getFullYear() === n.getFullYear() ? undefined : 'numeric' });
  };
  const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  // H158 end
  // H170 begin: a web address in a text becomes a link to tap, and [words](https://…) shows the words. Only http
  // and https (www. gets https://); the text is a text node, so nothing becomes HTML. It opens outside the chat.
  const LINK_RE = /\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|((?:https?:\/\/|\bwww\.)[^\s<>"]*[^\s<>".,;:!?)\]'*])/gi;
  function linked(el, s) {
    let at = 0;
    for (const m of s.matchAll(LINK_RE)) {
      if (m.index > at) el.append(document.createTextNode(s.slice(at, m.index)));
      const url = m[2] || m[3], a = document.createElement('a');
      a.href = /^www\./i.test(url) ? 'https://' + url : url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = m[1] || url;
      el.append(a);
      at = m.index + m[0].length;
    }
    if (at < s.length) el.append(document.createTextNode(s.slice(at)));
  }
  // H170 end
  // F42 begin: drawn again when the last text changes too, not only the count: the server sends the last 200,
  // so in a longer thread each new text pushes an old one off and the count stays the same.
  let drawnOn = '', drawnLast = '';

  function draw(msgs) {
    // Drawn again past midnight too, so Today becomes Yesterday.
    const today = new Date().toDateString();
    const lastOne = msgs[msgs.length - 1];
    const last = lastOne ? [lastOne.at, lastOne.from, lastOne.text].join('|') : '';
    if (msgs.length === shown && last === drawnLast && today === drawnOn) return;
    const fresh = msgs.length > shown || last !== drawnLast;
    drawnOn = today;
    const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    list.innerHTML = '';
    let lastDay = '';
    for (const m of msgs) {
      if (dayKey(m.at) !== lastDay) {
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = day(m.at);
        list.append(t);
        lastDay = dayKey(m.at);
      }
      const d = document.createElement('div');
      d.className = 'm ' + (m.from === 'me' ? 'me' : 'agent') + (m.quiet ? ' quiet' : '');  // F79: her note for herself
      linked(d, m.text || '');
      const at = document.createElement('span');
      at.className = 'at';
      at.textContent = clock(m.at);
      at.title = new Date(m.at * 1000).toLocaleString();
      d.append(at);
      list.append(d);
    }
    if (!msgs.length) list.innerHTML = '<div id="empty">No texts yet.</div>';
    if (atEnd || fresh) list.scrollTop = list.scrollHeight;
    shown = msgs.length;
    drawnLast = last;
  }
  // F42 end

  async function load() {
    try {
      const r = await fetch(TEAM ? '/direct.json?line=team' : '/direct.json', { cache: 'no-store' });
      const d = await r.json();
      if (!info && d.agent) {
        info = d.agent;
        document.getElementById('who').textContent = info.name;
        document.documentElement.style.setProperty('--her', info.colour);
        document.getElementById('face').src = (CALL ? '' : location.port === '8444' ? `https://${location.hostname}:8443` : 'http://127.0.0.1:7860') + `/agents/${info.id}/picture`;
        input.placeholder = 'Text ' + info.name;
        document.title = info.name;
      }
      lineHere = d.line || '';
      draw(d.messages || []);
      const last = (d.messages || []).filter((m) => !m.quiet).slice(-1)[0];  // F79: her quiet note isn't her answer
      waiting = !!(last && last.from === 'me');
      document.getElementById('typing').textContent = waiting && info ? info.name + ' is typing…' : '';
    } catch {
      document.getElementById('typing').textContent = 'HQ doesn’t answer right now';
    }
  }

  // H217: travel advice starts where the phone is. Only when he allows his location in the app (the weather's "Use my
  // location", or the browser already allows it and he didn't pick his home place), a text carries the spot (about
  // ten metres), read ahead so sending never waits; the server keeps it with app/travel.py. Else it starts at home.
  let hereSpot = null;
  async function hereOk() {
    if (!navigator.geolocation) return false;
    let want = null;
    try { want = localStorage.getItem('hq-wx-gps'); } catch {}
    if (want === '0' || want === '1') return want === '1';
    try { return (await navigator.permissions.query({ name: 'geolocation' })).state === 'granted'; } catch { return false; }
  }
  async function readHere() {
    if (!(await hereOk())) { hereSpot = null; return; }
    navigator.geolocation.getCurrentPosition((p) => {
      hereSpot = { lat: p.coords.latitude.toFixed(4), lon: p.coords.longitude.toFixed(4), at: Date.now() };
    }, () => {}, { enableHighAccuracy: true, timeout: 15000, maximumAge: 2 * 60 * 1000 });
  }
  readHere();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) readHere(); });
  input.addEventListener('focus', () => { if (!hereSpot || Date.now() - hereSpot.at > 5 * 60 * 1000) readHere(); });

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    const here = !TEAM && hereSpot && Date.now() - hereSpot.at < 30 * 60 * 1000 ? { lat: hereSpot.lat, lon: hereSpot.lon } : {};
    try {
      await fetch('/direct/send', { method: 'POST', headers: { 'x-hq': 'direct', 'content-type': 'application/json' },
        body: JSON.stringify({ text, ...here, ...(TEAM ? { line: 'team' } : {}) }) });
    } catch { input.value = text; }
    load();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) {
      e.preventDefault();
      document.getElementById('f').requestSubmit();
    }
  });

  // Notifications: allowed once, from inside the home-screen app (iOS 16.4 and later). F102: the work is in
  // status/direct-check.js, shared with the call page: it looks once on every open, keeps the phone on the list and
  // reports what it sees (direct_line.py info shows it); what's wrong is said here in one plain line, never nothing.
  const pushline = document.getElementById('pushline');
  const SAY = {
    denied: 'Notifications are off for HQ. Turn them on in Settings, Notifications, HQ.',
    sw: 'Her texts can’t start on this phone right now. Close HQ and open it again.',
    key: 'HQ has no key for her texts right now. It tries again next time you open this.',
    nosub: 'This phone isn’t signed up for her texts. Tap the button to fix that.',
    oldkey: 'This phone signed up with an old key, so her texts can’t reach it. Tap the button to fix that.',
    post: 'HQ didn’t hear from this phone. It tries again next time you open this.',
    check: 'Her texts couldn’t be checked on this phone. It tries again next time you open this.',
  };
  function showPush(r) {
    const can = r.problem !== 'nosupport';
    const phone = /iPhone|iPad/.test(navigator.userAgent);
    bell.hidden = can ? !['default', 'nosub', 'oldkey'].includes(r.problem) : !phone || navigator.standalone;
    bell.disabled = !can;
    bell.textContent = can ? 'Turn on her texts' : 'Add HQ to the home screen for her texts';
    pushline.textContent = SAY[r.problem] || '';
    pushline.hidden = !pushline.textContent;
  }
  // The shared script loads on its own, after the chat: a failure here never touches the chat.
  async function pushCheck(opts) {
    try {
      if (!window.hqPush) {
        await new Promise((done, no) => {
          const s = document.createElement('script');
          s.src = '/direct-check.js';
          s.onload = done;
          s.onerror = no;
          document.head.append(s);
        });
      }
      showPush(await window.hqPush.check(opts));
    } catch {
      showPush({ problem: 'check' });
    }
  }
  bell.addEventListener('click', async () => {
    try {
      if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
    } catch {}
    pushCheck({ tap: true });
  });
  navigator.serviceWorker?.addEventListener('message', () => load());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  if (!TEAM) try { localStorage.setItem('hq-direct-seen', String(Date.now() / 1000)); } catch {}
  // H300: one tap at the top opens the other chat, Moneypenny's from Donna's and back, in the same place (the sheet, the
  // Mac app's tab, the theme kept). Only on an HQ with her line: without her, ?line=team answers with Donna's line.
  const swap = document.getElementById('swap');
  async function swapSetup() {
    try {
      const o = await (await fetch(TEAM ? '/direct.json' : '/direct.json?line=team', { cache: 'no-store' })).json();
      if (!o.agent || (TEAM ? lineHere !== 'team' : o.line !== 'team')) return;
      const u = new URL(location.href);
      if (TEAM) u.searchParams.delete('line'); else u.searchParams.set('line', 'team');
      swap.textContent = '⇄ ' + o.agent.name;
      swap.title = swap.ariaLabel = 'Switch to ' + o.agent.name + '’s chat';
      if (o.agent.colour) swap.style.borderColor = o.agent.colour;
      swap.onclick = () => location.replace(u.pathname + u.search);
      swap.hidden = false;
    } catch {}
  }
  load().then(swapSetup);
  if (!APP) pushCheck();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
