<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16181c">
<link rel="manifest" href="/hq.webmanifest">
<link rel="apple-touch-icon" href="/hq-icon-180.png">
<title>Direct line</title>
<!-- H80: HQ's own direct line. A chat with only her, like texting; her texts also arrive on the lock screen
     (Web Push, allowed once from inside the home-screen app). Reads /direct.json, sends with /direct/send. -->
<style>
  :root { --bg: #16181c; --panel: #1f2228; --text: #e8e9ec; --dim: #9aa0aa; --me: #16a34a; --her: #7c3aed; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid #2a2e36; }
  header a { color: var(--dim); text-decoration: none; font-size: 22px; padding-right: 4px; }
  #face { width: 34px; height: 34px; border-radius: 50%; background: var(--her); object-fit: cover; }
  #who { font-weight: 600; }
  #sub { color: var(--dim); font-size: 12px; }
  #bell { margin-left: auto; background: var(--her); color: #fff; border: 0; border-radius: 16px; padding: 6px 12px; font-size: 13px; }
  #bell[hidden] { display: none; }
  #list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
  .m { max-width: 80%; padding: 8px 12px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .agent { align-self: flex-start; background: var(--panel); border-bottom-left-radius: 6px; border-left: 3px solid var(--her); }
  .me { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 6px; }
  .t { color: var(--dim); font-size: 11px; text-align: center; margin: 8px 0 2px; }
  #typing { color: var(--dim); font-size: 13px; padding: 0 16px 6px; min-height: 18px; }
  form { display: flex; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #2a2e36; }
  textarea { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid #2a2e36;
    border-radius: 20px; padding: 9px 14px; font: inherit; max-height: 120px; }
  button[type=submit] { background: var(--her); color: #fff; border: 0; border-radius: 20px; padding: 0 16px; font: inherit; }
  #empty { color: var(--dim); text-align: center; margin-top: 30%; }
</style>
</head>
<body>
<header>
  <a href="/hq" aria-label="Back to HQ">‹</a>
  <img id="face" alt="">
  <div><div id="who">Donna</div><div id="sub">HQ's direct line</div></div>
  <button id="bell" hidden>Turn on her texts</button>
</header>
<div id="list"><div id="empty">No texts yet.</div></div>
<div id="typing"></div>
<form id="f"><textarea id="in" rows="1" placeholder="Text her"></textarea><button type="submit">Send</button></form>
<script>
  // F25: also served through the call line (8443), when the phone's home-screen icon is the call page itself:
  // back goes to the call page, and the page keeps that app's manifest and icon.
  const CALL = location.port === '8443';
  // F29: opened in the sheet over the call page (?sheet): the sheet has its own Close, so no back arrow, and
  // no notification button (they're allowed on this page opened on its own; a frame mustn't sign a phone up).
  const SHEET = new URLSearchParams(location.search).has('sheet');
  if (SHEET) {
    document.querySelector('header a').remove();
    document.body.style.paddingTop = '0';
  }
  // H145: inside the Mac app (?app), on its own tab: the app has the tabs and shows her texts as Mac notifications
  // itself, so no back arrow and no notification button.
  const APP = new URLSearchParams(location.search).has('app');
  if (APP) document.querySelector('header a').remove();
  if (CALL && !SHEET) document.querySelector('header a').href = '/';
  if (CALL) {
    document.querySelector('link[rel=manifest]').href = '/manifest.webmanifest';
    document.querySelector('link[rel=apple-touch-icon]').href = '/apple-touch-icon.png';
  }
(() => {
  const list = document.getElementById('list');
  const input = document.getElementById('in');
  const bell = document.getElementById('bell');
  let shown = 0, info = null, waiting = false;
  const day = (t) => new Date(t * 1000).toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
  const clock = (t) => new Date(t * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  function draw(msgs) {
    if (msgs.length === shown) return;
    const atEnd = list.scrollHeight - list.scrollTop - list.clientHeight < 80;
    list.innerHTML = '';
    let lastDay = '', lastT = 0;
    for (const m of msgs) {
      if (day(m.at) !== lastDay || m.at - lastT > 3600) {
        const t = document.createElement('div');
        t.className = 't';
        t.textContent = (day(m.at) !== lastDay ? day(m.at) + ' ' : '') + clock(m.at);
        list.append(t);
        lastDay = day(m.at);
      }
      lastT = m.at;
      const d = document.createElement('div');
      d.className = 'm ' + (m.from === 'me' ? 'me' : 'agent');
      d.textContent = m.text;
      list.append(d);
    }
    if (!msgs.length) list.innerHTML = '<div id="empty">No texts yet.</div>';
    if (atEnd || msgs.length > shown) list.scrollTop = list.scrollHeight;
    shown = msgs.length;
  }

  async function load() {
    try {
      const r = await fetch('/direct.json', { cache: 'no-store' });
      const d = await r.json();
      if (!info && d.agent) {
        info = d.agent;
        document.getElementById('who').textContent = info.name;
        document.documentElement.style.setProperty('--her', info.colour);
        document.getElementById('face').src = (CALL ? '' : location.port === '8444' ? `https://${location.hostname}:8443` : 'http://127.0.0.1:7860') + `/agents/${info.id}/picture`;
        input.placeholder = 'Text ' + info.name;
        document.title = info.name;
      }
      draw(d.messages || []);
      const last = (d.messages || []).slice(-1)[0];
      waiting = !!(last && last.from === 'me');
      document.getElementById('typing').textContent = waiting && info ? info.name + ' is typing…' : '';
    } catch {
      document.getElementById('typing').textContent = 'HQ doesn’t answer right now';
    }
  }

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    try {
      await fetch('/direct/send', { method: 'POST', headers: { 'x-hq': 'direct', 'content-type': 'application/json' },
        body: JSON.stringify({ text }) });
    } catch { input.value = text; }
    load();
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) {
      e.preventDefault();
      document.getElementById('f').requestSubmit();
    }
  });

  // Notifications: allowed once, from inside the home-screen app (iOS 16.4 and later).
  const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - s.length % 4) % 4)), (c) => c.charCodeAt(0));
  async function registration() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
    return navigator.serviceWorker.register('/direct-sw.js', { scope: '/' });
  }
  async function subscribe() {
    const reg = await registration();
    if (!reg) return;
    await navigator.serviceWorker.ready;
    const k = await (await fetch('/direct/key', { cache: 'no-store' })).json();
    if (!k.key) throw new Error('no key');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(k.key) });
    await fetch('/direct/subscribe', { method: 'POST', headers: { 'x-hq': 'direct', 'content-type': 'application/json' },
      body: JSON.stringify({ subscription: sub.toJSON(), device: navigator.userAgent }) });
  }
  async function bellState() {
    const can = 'Notification' in window && 'serviceWorker' in navigator && 'PushManager' in window;
    if (!can) {
      bell.hidden = !/iPhone|iPad/.test(navigator.userAgent) || navigator.standalone;
      bell.textContent = 'Add HQ to the home screen for her texts';
      bell.disabled = true;
      return;
    }
    if (Notification.permission === 'granted') {
      bell.hidden = true;
      try { await subscribe(); } catch {}  // keeps the phone on the list (a new key, a new HQ)
      return;
    }
    bell.hidden = Notification.permission === 'denied';
  }
  bell.addEventListener('click', async () => {
    try {
      const p = await Notification.requestPermission();
      if (p === 'granted') await subscribe();
    } catch {}
    bellState();
  });
  navigator.serviceWorker?.addEventListener('message', () => load());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  try { localStorage.setItem('hq-direct-seen', String(Date.now() / 1000)); } catch {}
  load();
  if (!SHEET && !APP) bellState();
  setInterval(load, 3000);
})();
</script>
</body>
</html>
