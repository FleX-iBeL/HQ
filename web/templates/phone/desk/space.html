<sc-if value="{{ s.space }}">
<div class="pad {{ padCls }}">
<div class="top">
<button class="iconbtn" aria-label="Back" onClick="{{ back }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div style="flex-grow: 1"></div>
<button class="pill" onClick="{{ call.space }}" style="background: {{ sa.color }}; color: {{ sa.ink }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call</button>
</div>
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div class="top"><span class="face" style="width: 48px; height: 48px; background: {{ sa.color }}; color: {{ sa.ink }}; font-size: 19px">{{ sa.initial }}</span><div class="col"><h1 class="h" style="font-size: 22px; letter-spacing: -0.02em">{{ sa.name }}</h1><span class="muted" style="font-size: 13px" data-oneline>{{ sa.role }}</span></div></div>
<div class="col" style="gap: 4px"><span style="font-size: 13px; font-weight: 600; color: {{ sa.accent }}">{{ sa.kicker }}</span><span class="h" style="font-size: 28px; line-height: 34px">{{ sa.headline }}</span><span class="muted" style="font-size: 15px">{{ sa.sub }}</span></div>
<sc-if value="{{ sa.hasAction }}"><button class="pill" onClick="{{ sa.action }}" style="align-self: flex-start; background: {{ sa.color }}; color: {{ sa.ink }}">{{ sa.actionLabel }}</button></sc-if>
</div>

<sc-if value="{{ s.donna }}">
<div class="list">
<sc-for list="{{ nudges }}" as="n">
<div class="row" role="button" tabindex="0" onClick="{{ n.open }}" onKeyDown="{{ n.key }}" style="cursor: pointer"><span class="grow col"><span style="font-size: 15px; font-weight: 600; text-decoration: {{ n.deco }}; color: {{ n.fc }}">{{ n.title }}</span><span class="muted" style="font-size: 13px">{{ n.sub }}</span></span><button class="small" onClick="{{ n.toggle }}">{{ n.label }}</button></div>
</sc-for>
</div>
</sc-if>

<div class="list">
<sc-for list="{{ spaceRows }}" as="r">
<button class="row" onClick="{{ r.go }}" data-row="{{ r.label }}"><span class="grow" style="font-size: 15px; font-weight: 600">{{ r.label }}</span><span style="font-size: 14px; color: {{ r.vc }}; font-weight: {{ r.vw }}">{{ r.value }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</sc-for>
</div>

<sc-if value="{{ s.mp }}">
<button class="card" onClick="{{ nav.status }}" style="border: none; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; text-align: left; font: inherit; color: #0f172a; cursor: pointer">
<span class="top" style="width: 100%"><span class="h grow" style="font-size: 17px">Status</span><span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{ hv.st.fg }}; font-weight: 600"><span style="width: 8px; height: 8px; border-radius: 4px; background: {{ hv.st.dot }}"></span>{{ hv.st.word }}</span></span>
<sc-for list="{{ hv.bars }}" as="u"><span class="col" key="{{ u.key }}" style="gap: 6px; width: 100%; opacity: {{ u.op }}"><span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{ u.label }}</span><span class="muted">{{ u.line }}</span></span><span class="bar"><span style="display: block; width: {{ u.w }}; height: 6px; background: #0f172a"></span></span></span></sc-for>
<span class="muted" style="font-size: 13px">{{ hv.workLine }}<sc-if value="{{ hv.workLine }}"> · </sc-if>open Status</span>
</button>
</sc-if>

<div style="flex-grow: 1"></div>
<div class="tbox" style="align-items: flex-end">
<label for="dk-space-text" class="sr">Text {{ sa.name }}</label>
<textarea id="dk-space-text" rows="1" data-hq-grow="1" enterkeyhint="{{ txBox.hint }}" placeholder="Text {{ sa.name }}" value="{{ drafts.textsSpace }}" onInput="{{ txBox.space.typed }}" onKeyDown="{{ txBox.space.key }}" ref="{{ txBox.grow }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 15px/22px Inter, sans-serif; color: #0f172a; padding: 11px 0; resize: none; overflow: hidden; box-sizing: border-box"></textarea>
<button aria-label="Send" onClick="{{ chat.space }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #0f172a; color: #ffffff; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</div>
</sc-if>
