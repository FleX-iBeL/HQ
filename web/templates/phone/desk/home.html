<sc-if value="{{ s.home }}">
<div class="pad {{ padCls }}">
<div class="top" style="padding: 0 4px">
<h1 class="h grow" style="font-size: 24px; line-height: 30px">{{ hv.day }}</h1>
<button onClick="{{ nav.weather }}" data-tour="wx" style="height: 40px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: none; border-radius: 20px; background: #ffffff; color: #0f172a; font: 600 13px Inter, sans-serif; box-shadow: 0 0 0 1px #e2e8f0 inset; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ wxIcon }}"></path></svg>{{ wxChip }}</button>
<button class="iconbtn" aria-label="Tutorial" onClick="{{ nav.tutorial }}" style="position: relative"><sc-if value="{{ tourDot }}"><span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 4px; background: #dc2626"></span></sc-if><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
<button class="iconbtn" aria-label="Settings" onClick="{{ nav.settings }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
<sc-if value="{{ free }}"><div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: #0f172a; color: #ffffff"><span style="padding: 2px 8px; border-radius: 8px; background: #ffffff; color: #0f172a; font-size: 11px; font-weight: 800; letter-spacing: 0.06em">FREE</span><span style="font-size: 13px; line-height: 18px">Plain Claude: none of your files, nothing saved.</span></div></sc-if>
<sc-if value="{{ offline }}"><div style="display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 18px; background: #fef3c7; color: #78350f"><span style="width: 8px; height: 8px; border-radius: 4px; background: #d97706; flex-shrink: 0"></span><span class="grow" style="font-size: 13px; line-height: 18px">HQ doesn’t answer right now.{{ hv.since }}</span><button class="small" onClick="{{ goOnline }}" style="background: #ffffff">Try again</button></div></sc-if>
<sc-if value="{{ mpv.updBar.on }}"><div role="status" style="flex-shrink: 0; min-width: 0; padding: 10px 8px 10px 14px; border-radius: 16px; background: {{ mpv.updBar.tone }}; color: {{ mpv.updBar.fg }}; box-shadow: 0 0 0 1px #e2e8f0 inset; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px"><span class="grow col" style="gap: 2px; min-width: 0; flex: 1 1 190px"><b style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.t }}</b><sc-if value="{{ mpv.updBar.hasLine }}"><span style="opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.line }}</span></sc-if></span><sc-if value="{{ mpv.updBar.hasB }}"><button class="small" onClick="{{ mpv.updBar.bDo }}" style="height: 32px; background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ mpv.updBar.b }}</button></sc-if><sc-if value="{{ mpv.updBar.hasA }}"><button class="small" onClick="{{ mpv.updBar.aDo }}" style="height: 32px; background: #0f172a; color: #ffffff">{{ mpv.updBar.a }}</button></sc-if><sc-if value="{{ mpv.updBar.x }}"><button class="small" aria-label="Not now, until the next version" onClick="{{ mpv.updBar.xDo }}" style="height: 32px; width: 32px; padding: 0; background: transparent">×</button></sc-if></div></sc-if>

<sc-for list="{{ hv.cards }}" as="k">
<button class="card" key="{{ k.key }}" data-tour="agents" onClick="{{ k.open }}" style="border: none; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; font: inherit; color: #0f172a; cursor: pointer">
<span class="top" style="width: 100%"><span class="face" style="width: 36px; height: 36px; background: {{ k.color }}; color: {{ k.ink }}; font-size: 15px">{{ k.initial }}</span><span class="h grow" style="font-size: 17px">{{ k.name }}</span><span style="display: flex; align-items: center; gap: 6px; min-width: 0; text-align: right; font-size: 13px; color: {{ k.badgeC }}; font-weight: {{ k.badgeW }}"><sc-if value="{{ k.dot }}"><span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{ k.dotC }}"></span></sc-if>{{ k.badge }}</span></span>
<span class="col" style="gap: 2px; min-width: 0"><span class="h" style="font-size: 22px; line-height: 28px; overflow-wrap: anywhere">{{ k.headline }}</span><sc-if value="{{ k.sub }}"><span class="muted" style="font-size: 14px">{{ k.sub }}</span></sc-if></span>
</button>
</sc-for>

<div class="col" style="gap: 10px">
<div class="top" style="padding: 0 4px"><h2 class="h grow" style="font-size: 17px">Today</h2><button onClick="{{ nav.agenda }}" style="border: none; background: transparent; font: 600 13px Inter, sans-serif; color: #6d28d9; cursor: pointer; padding: 8px 0">Agenda</button></div>
<div style="display: flex; align-items: stretch; gap: 8px; margin-right: -16px; overflow-x: auto; padding-bottom: 2px">
<sc-for list="{{ todayRow }}" as="t">
<sc-if value="{{ t.isNow }}"><div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="padding: 2px 8px; border-radius: 9px; background: #0f172a; color: #ffffff; font-size: 11px; font-weight: 700">Now</span><span style="width: 2px; flex-grow: 1; background: #0f172a"></span></div></sc-if>
<sc-if value="{{ t.isItem }}"><button onClick="{{ t.open }}" style="flex: 0 0 auto; display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: none; border-radius: 16px; background: {{ t.bg }}; box-shadow: {{ t.shadow }}; text-align: left; font: inherit; cursor: pointer"><span style="font-size: 12px; font-weight: 600; color: {{ t.tc }}">{{ t.time }}</span><span style="font-size: 14px; font-weight: 600; color: {{ t.fc }}">{{ t.title }}</span></button></sc-if>
</sc-for>
</div>
</div>

<div style="flex-grow: 1"></div>
<div class="col" style="gap: 8px">
<sc-if value="{{ callLast.on }}"><button onClick="{{ callLast.go }}" style="align-self: flex-start; padding: 4px; border: none; background: transparent; font: 600 13px Inter, sans-serif; color: {{ callLast.color }}; cursor: pointer">{{ callLast.line }}</button></sc-if>
<div role="radiogroup" aria-label="Talk to" style="display: flex; gap: 6px; padding: 0 4px">
<sc-for list="{{ textChips }}" as="c"><button role="radio" aria-checked="{{ c.on }}" class="chip" onClick="{{ c.pick }}" style="background: {{ c.bg }}; color: {{ c.fg }}; box-shadow: {{ c.shadow }}">{{ c.name }}</button></sc-for>
</div>
<div class="tbox" style="align-items: flex-end">
<label for="dk-home-text" class="sr">Text {{ tt.name }}</label>
<textarea id="dk-home-text" rows="1" data-hq-grow="1" enterkeyhint="{{ txBox.hint }}" placeholder="Text {{ tt.name }}" value="{{ drafts.textsHome }}" onInput="{{ txBox.home.typed }}" onKeyDown="{{ txBox.home.key }}" ref="{{ txBox.grow }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 15px/22px Inter, sans-serif; color: #0f172a; padding: 11px 0; resize: none; overflow: hidden; box-sizing: border-box"></textarea>
<button aria-label="Send to {{ tt.name }}" onClick="{{ chat.textTo }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #f1f5f9; color: #0f172a; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
<button aria-label="Call {{ tt.name }}" data-tour="call" onClick="{{ call.textTo }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: {{ tt.color }}; color: {{ tt.ink }}; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>
</div>
</div>
</sc-if>
