<sc-if value="{{ s.home }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: {{ sa.tint }}; padding-top: {{ chatTop }}">
<div class="top" style="padding: 0 20px">
<button onClick="{{ nav.weather }}" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 22px; background: rgba(255,255,255,0.75); color: #1d1b22; font: 600 14px 'DM Sans', sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 16.2A4.5 4.5 0 0 0 17.5 8h-1.8A7 7 0 1 0 4 14.9"></path><path d="M16 14v6M8 14v6M12 16v6"></path></svg>7°</button>
<div class="grow" style="display: flex; justify-content: center; gap: 8px" role="img" aria-label="{{ sa.name }}"><sc-for list="{{ spotDots }}" as="d"><span style="width: {{ d.w }}; height: 8px; border-radius: 4px; background: {{ d.c }}; opacity: {{ d.op }}"></span></sc-for></div>
<button class="iconbtn" aria-label="Tutorial" onClick="{{ nav.tutorial }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
<button class="iconbtn" aria-label="Settings" onClick="{{ nav.settings }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
<sc-if value="{{ free }}"><div style="margin: 12px 20px 0; padding: 10px 14px; border-radius: 16px; background: #1d1b22; color: #ffffff; font-size: 13px"><b>FREE</b> · Plain Claude: none of your files, nothing saved.</div></sc-if>
<sc-if value="{{ offline }}"><div style="margin: 12px 20px 0; padding: 8px 8px 8px 14px; border-radius: 16px; background: #fef3c7; color: #78350f; display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="grow">HQ doesn’t answer right now.</span><button class="small" onClick="{{ goOnline }}" style="background: #ffffff">Try again</button></div></sc-if>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px">
<div style="display: flex; align-items: center; gap: 14px">
<button class="iconbtn" aria-label="Previous" onClick="{{ spotPrev }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button onClick="{{ openHer }}" aria-label="Open {{ sa.name }}’s things" style="width: 168px; height: 168px; border: none; border-radius: 84px; background: {{ sa.color }}; color: {{ sa.ink }}; font: 600 68px 'DM Sans', sans-serif; box-shadow: 0 24px 60px {{ sa.ring }}; cursor: pointer">{{ sa.initial }}</button>
<button class="iconbtn" aria-label="Next" onClick="{{ spotNext }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
<div class="col" style="align-items: center; gap: 2px; text-align: center"><h1 class="h" style="font-size: 38px; line-height: 44px">{{ sa.name }}</h1><span style="font-size: 15px; color: #4b4458">{{ sa.role }}</span></div>
<button class="pill" onClick="{{ call.space }}" style="width: 100%; height: 64px; border-radius: 32px; background: {{ sa.color }}; color: {{ sa.ink }}; font-size: 17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call {{ sa.name }}</button>
</div>
<div style="padding: 10px 18px 30px; background: #ffffff; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(29,27,34,0.08); display: flex; flex-direction: column; gap: 10px">
<button onClick="{{ openHer }}" aria-label="Pull up {{ sa.name }}’s things" style="align-self: center; width: 60px; height: 20px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: #d6d1df"></span></button>
<div class="col" style="gap: 6px"><span style="font-size: 13px; font-weight: 600; color: {{ sa.accent }}">{{ sa.kicker }}</span><span class="h" style="font-size: 20px">{{ sa.headline }}</span><sc-for list="{{ spotLines }}" as="l"><span style="font-size: 14px; color: {{ l.c }}; font-weight: {{ l.w }}">{{ l.t }}</span></sc-for></div>
<button onClick="{{ openHer }}" style="border: none; background: transparent; padding: 6px 0; font: 600 14px 'DM Sans', sans-serif; color: {{ sa.accent }}; cursor: pointer; text-align: left">Pull up for all of {{ sa.name }}’s things</button>
</div>
</div>
</sc-if>
