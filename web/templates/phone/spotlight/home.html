<sc-if value="{{ s.home }}">
<div data-g="home" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: {{ sa.tint }}; padding-top: {{ chatTop }}; touch-action: none">
<div class="top" style="padding: 0 20px">
<button onClick="{{ nav.weather }}" data-tour="wx" style="height: 44px; padding: 0 14px; display: flex; align-items: center; gap: 8px; border: none; border-radius: 22px; background: rgba(255,255,255,0.75); color: #1d1b22; font: 600 14px 'DM Sans', sans-serif; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ wxIcon }}"></path></svg>{{ wxChip }}</button>
<div class="grow" style="display: flex; justify-content: center; gap: 8px" role="img" aria-label="{{ sa.name }}"><sc-for list="{{ spotDots }}" as="d"><span style="width: {{ d.w }}; height: 8px; border-radius: 4px; background: {{ d.c }}; opacity: {{ d.op }}"></span></sc-for></div>
<button class="iconbtn" aria-label="Tutorial" onClick="{{ nav.tutorial }}" style="position: relative; background: rgba(255,255,255,0.75); box-shadow: none"><sc-if value="{{ tourDot }}"><span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 4px; background: #dc2626"></span></sc-if><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
<button class="iconbtn" aria-label="Settings" onClick="{{ nav.settings }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
<sc-if value="{{ free }}"><div style="margin: 12px 20px 0; padding: 10px 14px; border-radius: 16px; background: #1d1b22; color: #ffffff; font-size: 13px"><b>FREE</b> · Plain Claude: none of your files, nothing saved.</div></sc-if>
<sc-if value="{{ offline }}"><div style="margin: 12px 20px 0; padding: 8px 8px 8px 14px; border-radius: 16px; background: #fef3c7; color: #78350f; display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="grow">HQ doesn’t answer right now.</span><button class="small" onClick="{{ goOnline }}" style="background: #ffffff">Try again</button></div></sc-if>
<sc-if value="{{ mpv.updBar.on }}"><div role="status" style="margin: 12px 20px 0; flex-shrink: 0; min-width: 0; padding: 10px 8px 10px 14px; border-radius: 16px; background: {{ mpv.updBar.tone }}; color: {{ mpv.updBar.fg }}; box-shadow: 0 0 0 1px #e2e8f0 inset; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px"><span class="grow col" style="gap: 2px; min-width: 0; flex: 1 1 190px"><b style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.t }}</b><sc-if value="{{ mpv.updBar.hasLine }}"><span style="opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.line }}</span></sc-if></span><sc-if value="{{ mpv.updBar.hasB }}"><button class="small" onClick="{{ mpv.updBar.bDo }}" style="height: 32px; background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ mpv.updBar.b }}</button></sc-if><sc-if value="{{ mpv.updBar.hasA }}"><button class="small" onClick="{{ mpv.updBar.aDo }}" style="height: 32px; background: #0f172a; color: #ffffff">{{ mpv.updBar.a }}</button></sc-if><sc-if value="{{ mpv.updBar.x }}"><button class="small" aria-label="Not now, until the next version" onClick="{{ mpv.updBar.xDo }}" style="height: 32px; width: 32px; padding: 0; background: transparent">×</button></sc-if></div></sc-if>
<div data-g="stage" style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 0 24px">
<div style="display: flex; align-items: center; gap: 14px">
<button class="iconbtn" aria-label="Previous" onClick="{{ spotPrev }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<button data-g-act="open" data-tour="agents" onClick="{{ openHer }}" aria-label="Open {{ sa.name }}’s things" style="width: 168px; height: 168px; border: none; border-radius: 84px; background: {{ sa.color }}; color: {{ sa.ink }}; font: 600 68px 'DM Sans', sans-serif; box-shadow: 0 24px 60px {{ sa.ring }}; cursor: pointer">{{ sa.initial }}</button>
<button class="iconbtn" aria-label="Next" onClick="{{ spotNext }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
<div class="col" style="align-items: center; gap: 2px; text-align: center"><h1 class="h" style="font-size: 38px; line-height: 44px">{{ sa.name }}</h1><span style="font-size: 15px; color: #4b4458" data-oneline>{{ sa.role }}</span></div>
<button class="pill" data-tour="call" onClick="{{ call.space }}" style="width: 100%; height: 64px; border-radius: 32px; background: {{ sa.color }}; color: {{ sa.ink }}; font-size: 17px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call {{ sa.name }}</button>
<sc-if value="{{ callLast.on }}"><button onClick="{{ callLast.go }}" style="align-self: center; padding: 4px; border: none; background: transparent; font: 600 13px Inter, sans-serif; color: {{ callLast.color }}; cursor: pointer">{{ callLast.line }}</button></sc-if>
</div>
<div data-g="pullup" style="padding: 10px 18px 30px; background: #ffffff; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 30px rgba(29,27,34,0.08); display: flex; flex-direction: column; gap: 10px">
<button data-g-act="open" onClick="{{ openHer }}" aria-label="Pull up {{ sa.name }}’s things" style="align-self: center; width: 88px; height: 32px; margin: -6px 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><span style="width: 40px; height: 5px; border-radius: 3px; background: #d6d1df"></span></button>
<div class="col" style="gap: 6px"><span style="font-size: 13px; font-weight: 600; color: {{ sa.accent }}">{{ sa.kicker }}</span><span class="h" style="font-size: 20px">{{ sa.headline }}</span><sc-for list="{{ spotLines }}" as="l"><span style="font-size: 14px; color: {{ l.c }}; font-weight: {{ l.w }}">{{ l.t }}</span></sc-for></div>
<button data-g-act="open" onClick="{{ openHer }}" style="border: none; background: transparent; padding: 6px 0; font: 600 14px 'DM Sans', sans-serif; color: {{ sa.accent }}; cursor: pointer; text-align: left">Pull up for all of {{ sa.name }}’s things</button>
</div>
</div>
</sc-if>
