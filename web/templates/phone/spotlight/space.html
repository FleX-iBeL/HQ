<sc-if value="{{ s.space }}">
<div data-g="space" style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: {{ sa.tint }}">
<div class="top" data-g="space-head" style="padding: {{ chatTop }} 18px 14px; touch-action: none">
<button class="iconbtn" data-g-act="close" aria-label="Back to {{ sa.name }}" onClick="{{ back }}" style="background: rgba(255,255,255,0.75); box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<span class="face" style="width: 44px; height: 44px; background: {{ sa.color }}; color: {{ sa.ink }}; font-size: 18px">{{ sa.initial }}</span>
<div class="grow col"><h1 class="h" style="font-size: 20px">{{ sa.name }}</h1><span style="font-size: 13px; color: #4b4458" data-oneline>{{ sa.role }}</span></div>
<button class="iconbtn" aria-label="Call {{ sa.name }}" onClick="{{ call.space }}" style="width: 52px; height: 52px; border-radius: 26px; background: {{ sa.color }}; color: {{ sa.ink }}; box-shadow: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>
<div data-g="pulldown" style="flex-grow: 1; min-height: 0; overflow-y: auto; box-sizing: border-box; padding: 10px 16px 28px; background: #ffffff; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; gap: 14px">
<button data-g="handle" data-g-act="close" onClick="{{ back }}" aria-label="Back to {{ sa.name }}’s home" style="align-self: center; width: 88px; height: 28px; margin: -10px 0 -6px; flex-shrink: 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; touch-action: none"><span style="width: 40px; height: 5px; border-radius: 3px; background: #d6d1df"></span></button>
<div style="padding: 18px; border-radius: 22px; background: {{ sa.tint }}; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 600; color: {{ sa.accent }}">{{ sa.kicker }}</span><span class="h" style="font-size: 26px; line-height: 32px">{{ sa.headline }}</span><span style="font-size: 14px; color: #4b4458">{{ sa.sub }}</span><sc-if value="{{ sa.hasAction }}"><button class="pill" onClick="{{ sa.action }}" style="align-self: flex-start; margin-top: 8px; background: {{ sa.color }}; color: {{ sa.ink }}">{{ sa.actionLabel }}</button></sc-if></div>
<sc-if value="{{ s.donna }}"><div class="list"><sc-for list="{{ nudges }}" as="n"><div class="row" role="button" tabindex="0" onClick="{{ n.open }}" onKeyDown="{{ n.key }}" style="cursor: pointer"><span class="grow col"><span style="font-size: 15px; font-weight: 600; text-decoration: {{ n.deco }}; color: {{ n.fc }}">{{ n.title }}</span><span class="muted" style="font-size: 13px">{{ n.sub }}</span></span><button class="small" onClick="{{ n.toggle }}">{{ n.label }}</button></div></sc-for></div></sc-if>
<div class="list"><sc-for list="{{ spaceRows }}" as="r"><button class="row" onClick="{{ r.go }}" data-row="{{ r.label }}"><span class="grow" style="font-size: 15px; font-weight: 600">{{ r.label }}</span><span style="font-size: 14px; color: {{ r.vc }}; font-weight: {{ r.vw }}">{{ r.value }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div>
<sc-if value="{{ s.mp }}"><button class="card" onClick="{{ nav.status }}" style="border: none; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; font: inherit; color: #1d1b22; cursor: pointer"><span class="top" style="width: 100%"><span class="h grow" style="font-size: 17px">Status</span><span style="font-size: 13px; color: {{ hv.st.fg }}; font-weight: 600">{{ hv.st.word }}</span></span><sc-for list="{{ hv.bars }}" as="u"><span class="col" key="{{ u.key }}" style="gap: 6px; width: 100%; opacity: {{ u.op }}"><span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{ u.label }}</span><span class="muted">{{ u.pct }}</span></span><span class="bar"><span style="display: block; width: {{ u.w }}; height: 6px; background: #1d1b22"></span></span></span></sc-for></button></sc-if>
<div class="tbox" style="align-items: flex-end"><label for="sp-space-text" class="sr">Text {{ sa.name }}</label><textarea id="sp-space-text" rows="1" data-hq-grow="1" enterkeyhint="{{ txBox.hint }}" placeholder="Text {{ sa.name }}" value="{{ drafts.textsSpace }}" onInput="{{ txBox.space.typed }}" onKeyDown="{{ txBox.space.key }}" ref="{{ txBox.grow }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 15px/22px Inter, sans-serif; color: #0f172a; padding: 11px 0; resize: none; overflow: hidden; box-sizing: border-box"></textarea><button aria-label="Send" onClick="{{ chat.space }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: {{ sa.color }}; color: {{ sa.ink }}; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</div>
</div>
</sc-if>
