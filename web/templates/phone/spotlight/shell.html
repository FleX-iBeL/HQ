<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #ffffff; color: #1d1b22; font-family: 'DM Sans', system-ui, sans-serif">

<sc-if value="{{ showMini }}">
<button onClick="{{ nav.call }}" style="margin: 50px 12px 0; height: 52px; flex-shrink: 0; padding: 0 8px; display: flex; align-items: center; gap: 10px; border: none; border-radius: 26px; background: {{ ca.color }}; color: {{ ca.ink }}; font: 600 14px 'DM Sans', sans-serif; cursor: pointer">
<span class="face" style="width: 36px; height: 36px; background: rgba(255,255,255,0.25); font-size: 14px">{{ ca.initial }}</span>
<span style="flex-grow: 1; text-align: left">On a call with {{ ca.name }} · {{ phase }}</span>
<span style="padding: 0 12px; font-size: 13px">Open</span>
</button>
</sc-if>

<!-- HOME: one of the three, full screen -->
<hq-include name="home"></hq-include>

<!-- HER THINGS, pulled up -->
<hq-include name="space"></hq-include>

<!-- CALL -->
<hq-include name="call"></hq-include>

<!-- CALL TRANSCRIPT -->
<hq-include name="transcript"></hq-include>

<!-- CHAT (texts) -->
<hq-include name="chat"></hq-include>



<sc-if value="{{ s.sub }}">
<div class="pad {{ padCls }}">
<div class="top">
<button class="iconbtn" aria-label="Back" onClick="{{ back }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<div class="grow col"><span style="font-size: 12px; font-weight: 600; color: {{ owner.accent }}">{{ owner.label }}</span><h1 class="h" style="font-size: 22px; line-height: 28px">{{ title }}</h1></div>
</div>
<!-- AGENDA -->
<hq-include name="agenda"></hq-include>

<!-- APPOINTMENT -->
<hq-include name="appt"></hq-include>

<!-- TO-DO -->
<hq-include name="todo"></hq-include>

<!-- TO-DO ITEM -->
<hq-include name="todoItem"></hq-include>

<!-- LISTS -->
<hq-include name="lists"></hq-include>

<!-- BUCKET ITEM -->
<hq-include name="bucketItem"></hq-include>

<!-- MAIL -->
<hq-include name="mail"></hq-include>

<!-- NOTES -->
<hq-include name="notes"></hq-include>

<!-- PAST CALLS -->
<hq-include name="pastCalls"></hq-include>

<!-- ONE PAST CALL -->
<hq-include name="callLog"></hq-include>

<!-- MAP -->
<hq-include name="map"></hq-include>

<!-- CHECK-IN -->
<hq-include name="checkin"></hq-include>

<!-- GAME -->
<hq-include name="game"></hq-include>

<!-- HAND-OVERS -->
<hq-include name="handovers"></hq-include>

<!-- ONE HAND-OVER -->
<hq-include name="handover"></hq-include>

<!-- STATUS -->
<hq-include name="status"></hq-include>

<!-- PLANNING BOARD -->
<hq-include name="planning"></hq-include>

<!-- WORK SESSIONS -->
<hq-include name="sessions"></hq-include>

<!-- HEALTH -->
<hq-include name="health"></hq-include>

<!-- UPDATES -->
<hq-include name="updates"></hq-include>

<!-- SETTINGS -->
<hq-include name="settings"></hq-include>

<!-- WEATHER -->
<hq-include name="weather"></hq-include>

<!-- A WHOLE LIST -->
<hq-include name="todoList"></hq-include>

<!-- AGENDA FILTER -->
<hq-include name="agendaFilter"></hq-include>

<!-- KINDS OF TIME -->
<hq-include name="kinds"></hq-include>

<!-- A SUB-ITEM -->
<hq-include name="subItem"></hq-include>

<!-- A MAP LAYER -->
<hq-include name="layer"></hq-include>

<!-- YOUR GAMES -->
<hq-include name="games"></hq-include>

<!-- WHAT HQ HELPS YOU WITH -->
<hq-include name="features"></hq-include>

<!-- MICROPHONE AND SOUND -->
<hq-include name="sound"></hq-include>

<!-- VOICES -->
<hq-include name="voices"></hq-include>

<!-- TUTORIAL -->
<hq-include name="tutorial"></hq-include>

</div>
</sc-if>

<sc-if value="{{ sheetOn }}">
<div style="position: absolute; inset: 0; z-index: 20; background: rgba(15,23,42,0.4); display: flex; align-items: flex-end">
<div role="dialog" aria-label="{{ sh.title }}" style="width: 100%; box-sizing: border-box; padding: 10px 16px 34px; border-radius: 28px 28px 0 0; background: #f8fafc; display: flex; flex-direction: column; gap: 12px">
<span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #cbd5e1"></span>
<div class="top"><h2 class="h grow" style="font-size: 18px">{{ sh.title }}</h2><button class="small" onClick="{{ closeSheet }}">Close</button></div>
<div class="list"><sc-for list="{{ sh.rows }}" as="r"><button class="row" onClick="{{ r.pick }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ r.a }}</span><span class="muted" style="font-size: 13px">{{ r.b }}</span></span></button></sc-for></div>
</div>
</div>
</sc-if>

<sc-if value="{{ toastOn }}"><div role="status" style="position: absolute; left: 16px; right: 16px; top: 56px; z-index: 30; padding: 10px 10px 10px 18px; border-radius: 18px; background: #0f172a; color: #ffffff; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(15,23,42,0.25)"><span class="grow" style="font-size: 14px; line-height: 20px">{{ toast }}</span><sc-if value="{{ toastUndo }}"><button onClick="{{ undo }}" style="height: 36px; padding: 0 14px; border: none; border-radius: 18px; background: rgba(255,255,255,0.16); color: #ffffff; font: 600 13px Inter, sans-serif; cursor: pointer">Undo</button></sc-if></div></sc-if>

<sc-if value="{{ incoming }}">
<div role="dialog" aria-label="Donna is calling" style="position: absolute; inset: 0; z-index: 40; box-sizing: border-box; padding: 120px 24px 60px; background: #f5f3ff; display: flex; flex-direction: column; align-items: center; gap: 18px">
<span class="face" style="width: 160px; height: 160px; background: #6d28d9; color: #ffffff; font-size: 60px; box-shadow: 0 0 0 18px rgba(109,40,217,0.15)">D</span>
<h1 class="h" style="font-size: 30px">Donna is calling</h1>
<span class="muted" style="font-size: 15px; text-align: center; line-height: 22px">About the dentist: it’s nearly time to leave.</span>
<div style="flex-grow: 1"></div>
<div style="width: 100%; display: flex; gap: 12px"><button class="pill grow" onClick="{{ decline }}" style="height: 60px; border-radius: 30px; background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Not now</button><button class="pill grow" onClick="{{ pickUp }}" style="height: 60px; border-radius: 30px; background: #16a34a; color: #ffffff">Pick up</button></div>
</div>
</sc-if>

<sc-if value="{{ tourOn }}">
<div style="position: absolute; inset: 0; z-index: 25; background: rgba(15,23,42,0.35); display: flex; align-items: flex-end; padding: 16px 16px 120px; box-sizing: border-box">
<div class="card" style="width: 100%; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
<span class="top"><span style="padding: 2px 8px; border-radius: 8px; background: #f1f5f9; font-size: 11px; font-weight: 700; color: #475569">DEMO</span><span class="muted grow" style="font-size: 12px">Home · {{ tourCount }}</span><button class="small" aria-label="Close the tour" onClick="{{ tourClose }}">Close</button></span>
<span class="h" style="font-size: 20px">{{ tourTitle }}</span>
<span style="font-size: 15px; line-height: 22px">{{ tourText }}</span>
<div style="display: flex; gap: 8px"><button class="pill grow" onClick="{{ tourBack }}" style="background: #f1f5f9; color: #0f172a">Back</button><button class="pill grow" onClick="{{ demoCall.donna }}" style="background: #f5f3ff; color: #6d28d9">Ask Donna</button><button class="pill grow" onClick="{{ tourNext }}" style="background: #0f172a; color: #ffffff">{{ tourNextLabel }}</button></div>
</div>
</div>
</sc-if>


</div>
