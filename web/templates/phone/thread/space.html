<sc-if value="{{ s.space }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column">
<div style="padding: {{ chatTop }} 12px 10px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #ececf0; background: #fbfbfc">
<div class="top" style="gap: 8px">
<button class="iconbtn" aria-label="Back to the three" onClick="{{ back }}" style="box-shadow: none; background: transparent; color: {{ sa.accent }}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
<span class="face" style="width: 40px; height: 40px; background: {{ sa.color }}; color: {{ sa.ink }}; font-size: 16px">{{ sa.initial }}</span>
<div class="grow col"><h1 class="h" style="font-size: 17px; letter-spacing: -0.01em">{{ sa.name }}</h1><span class="muted" style="font-size: 12px">{{ sa.role }}</span></div>
<button class="iconbtn" aria-label="Call {{ sa.name }}" onClick="{{ call.space }}" style="background: {{ sa.color }}; color: {{ sa.ink }}; box-shadow: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>
<div style="display: flex; gap: 6px; padding: 0 6px; overflow-x: auto"><sc-for list="{{ spaceRows }}" as="r"><button onClick="{{ r.go }}" style="flex-shrink: 0; height: 36px; padding: 0 12px; border: none; border-radius: 18px; background: {{ sa.tint }}; color: {{ sa.accent }}; font: 600 13px Inter, sans-serif; cursor: pointer">{{ r.label }}</button></sc-for></div>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<span style="align-self: center; padding: 4px 10px; border-radius: 10px; background: #f2f2f5; font-size: 12px; font-weight: 600; color: #55555c">Today</span>
<sc-for list="{{ spaceBubbles }}" as="b"><div style="align-self: {{ b.align }}; max-width: 280px; padding: 9px 14px; border-radius: {{ b.radius }}; background: {{ b.bg }}; color: {{ b.fg }}; font-size: 15px; line-height: 21px">{{ b.t }}</div></sc-for>
<div style="align-self: flex-start; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 20px; box-shadow: 0 0 0 1px #e4e4ea inset"><span style="font-size: 12px; font-weight: 700; color: {{ sa.accent }}">{{ sa.kicker }}</span><span style="font-size: 18px; font-weight: 700">{{ sa.headline }}</span><span style="font-size: 14px; color: #3c3c43">{{ sa.sub }}</span><sc-if value="{{ sa.hasAction }}"><button class="pill" onClick="{{ sa.action }}" style="align-self: flex-start; margin-top: 6px; height: 40px; background: {{ sa.color }}; color: {{ sa.ink }}">{{ sa.actionLabel }}</button></sc-if></div>
<sc-if value="{{ s.donna }}"><div style="align-self: flex-start; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: 20px; background: #f7f7f9"><span style="font-size: 12px; font-weight: 700; color: #55555c">STILL OPEN · I’LL KEEP NUDGING</span><sc-for list="{{ nudges }}" as="n"><div class="top"><span class="grow" style="font-size: 15px; font-weight: 600; text-decoration: {{ n.deco }}; color: {{ n.fc }}">{{ n.title }}</span><button class="small" onClick="{{ n.toggle }}" style="background: #ffffff; box-shadow: 0 0 0 1px #e4e4ea inset">{{ n.label }}</button></div></sc-for></div></sc-if>
<sc-if value="{{ s.mp }}"><button onClick="{{ nav.status }}" style="align-self: flex-start; width: 300px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: none; border-radius: 20px; background: #f7f7f9; text-align: left; font: inherit; color: #111114; cursor: pointer"><span style="font-size: 12px; font-weight: 700; color: #15803d">STATUS · EVERYTHING IS RUNNING</span><span style="font-size: 14px">Usage 34% now, 61% this week · 2 things being worked on</span><span style="font-size: 13px; font-weight: 600; color: #854d0e">Open Status</span></button></sc-if>
<span style="padding-left: 6px; font-size: 12px; color: #55555c">{{ sa.name }} · 14:02</span>
</div>
<div style="padding: 8px 12px 30px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #ececf0; background: #fbfbfc">
<div class="tbox grow" style="padding: 0 6px 0 16px; height: 44px"><label for="th-space-text" class="sr">Text {{ sa.name }}</label><input id="th-space-text" placeholder="Text {{ sa.name }}"></div>
<button aria-label="Hold to talk to {{ sa.name }}" onClick="{{ call.space }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #111114; color: #ffffff; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg></button>
</div>
</div>
</sc-if>
