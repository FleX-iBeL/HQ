<sc-if value="{{ s.home }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; padding-top: {{ chatTop }}">
<div class="top" style="padding: 0 10px">
<button class="iconbtn" aria-label="Tutorial" onClick="{{ nav.tutorial }}" style="position: relative; box-shadow: none; background: transparent"><sc-if value="{{ tourDot }}"><span aria-hidden="true" style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 4px; background: #dc2626"></span></sc-if><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
<div class="grow"></div>
<button class="iconbtn" aria-label="Settings" onClick="{{ nav.settings }}" style="box-shadow: none; background: transparent"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"></path></svg></button>
</div>
<div class="col" style="padding: 2px 20px 14px; gap: 2px"><h1 class="h" style="font-size: 34px; line-height: 41px">HQ</h1><button onClick="{{ nav.weather }}" data-tour="wx" style="align-self: flex-start; border: none; background: transparent; padding: 2px 0; font: 400 15px Inter, sans-serif; color: #55555c; cursor: pointer; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ wxIcon }}"></path></svg>{{ hv.wxDay }}</button></div>
<sc-if value="{{ free }}"><div style="margin: 0 16px 10px; padding: 10px 14px; border-radius: 14px; background: #111114; color: #ffffff; font-size: 13px"><b>FREE</b> · Plain Claude: none of your files, nothing saved.</div></sc-if>
<sc-if value="{{ offline }}"><div style="margin: 0 16px 10px; padding: 8px 8px 8px 14px; border-radius: 14px; background: #fef3c7; color: #78350f; display: flex; align-items: center; gap: 10px; font-size: 13px"><span class="grow">HQ doesn’t answer right now.</span><button class="small" onClick="{{ goOnline }}" style="background: #ffffff">Try again</button></div></sc-if>
<sc-if value="{{ mpv.updBar.on }}"><div role="status" style="margin: 0 16px 10px; flex-shrink: 0; min-width: 0; padding: 10px 8px 10px 14px; border-radius: 16px; background: {{ mpv.updBar.tone }}; color: {{ mpv.updBar.fg }}; box-shadow: 0 0 0 1px #e2e8f0 inset; display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px; font-size: 13px"><span class="grow col" style="gap: 2px; min-width: 0; flex: 1 1 190px"><b style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.t }}</b><sc-if value="{{ mpv.updBar.hasLine }}"><span style="opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ mpv.updBar.line }}</span></sc-if></span><sc-if value="{{ mpv.updBar.hasB }}"><button class="small" onClick="{{ mpv.updBar.bDo }}" style="height: 32px; background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ mpv.updBar.b }}</button></sc-if><sc-if value="{{ mpv.updBar.hasA }}"><button class="small" onClick="{{ mpv.updBar.aDo }}" style="height: 32px; background: #0f172a; color: #ffffff">{{ mpv.updBar.a }}</button></sc-if><sc-if value="{{ mpv.updBar.x }}"><button class="small" aria-label="Not now, until the next version" onClick="{{ mpv.updBar.xDo }}" style="height: 32px; width: 32px; padding: 0; background: transparent">×</button></sc-if></div></sc-if>
<sc-for list="{{ chatList }}" as="c">
<div data-tour="agents" style="display: flex; align-items: center; gap: 12px; padding: 10px 16px 10px 20px">
<span class="face" style="width: 58px; height: 58px; background: {{ c.color }}; color: {{ c.ink }}; font-size: 23px">{{ c.initial }}</span>
<button onClick="{{ c.open }}" class="grow col" style="gap: 2px; padding: 4px 0 14px; border: none; border-bottom: 1px solid #e8e8ec; background: transparent; text-align: left; font: inherit; color: #111114; cursor: pointer">
<span style="display: flex; justify-content: space-between; align-items: baseline; width: 100%"><span style="font-size: 17px; font-weight: 600">{{ c.name }}</span><span style="font-size: 14px; color: {{ c.tc }}; font-weight: 600">{{ c.time }}</span></span>
<span style="display: flex; align-items: center; gap: 8px; width: 100%"><span class="grow" style="font-size: 15px; line-height: 20px; color: #3c3c43; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">{{ c.preview }}</span><sc-if value="{{ c.hasUnread }}"><span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 11px; background: {{ c.color }}; color: {{ c.ink }}; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{ c.unread }}</span></sc-if></span>
</button>
<button class="iconbtn" aria-label="Call {{ c.name }}" onClick="{{ c.call }}" style="background: #f2f2f5; box-shadow: none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
</div>
</sc-for>
<div style="flex-grow: 1"></div>
<div class="col" style="align-items: center; gap: 12px; padding: 0 20px 30px">
<sc-if value="{{ callLast.on }}"><button onClick="{{ callLast.go }}" style="padding: 4px; border: none; background: transparent; font: 600 13px Inter, sans-serif; color: {{ callLast.color }}; cursor: pointer">{{ callLast.line }}</button></sc-if>
<div role="radiogroup" aria-label="Talk to" style="display: flex; gap: 6px"><sc-for list="{{ textChips }}" as="c"><button role="radio" aria-checked="{{ c.on }}" class="chip" onClick="{{ c.pick }}" style="background: {{ c.bg }}; color: {{ c.fg }}; box-shadow: {{ c.shadow }}">{{ c.name }}</button></sc-for></div>
<button onClick="{{ call.textTo }}" data-tour="call" aria-label="Hold to talk to {{ tt.name }}" style="width: 84px; height: 84px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 42px; background: #111114; color: #ffffff; cursor: pointer"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg></button>
<span style="font-size: 14px; color: #55555c">Hold to talk to <b style="color: {{ tt.accent }}">{{ tt.name }}</b></span>
</div>
</div>
</sc-if>
