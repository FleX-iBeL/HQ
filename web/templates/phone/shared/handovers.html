<sc-if value="{{ s.handovers }}">
<sc-if value="{{ mpv.handoversWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.handoversWord }}</span><sc-if value="{{ mpv.handoversFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<sc-if value="{{ mpv.handoversEmpty }}"><div class="card" style="padding: 20px; font-size: 15px; line-height: 22px">No hand-overs yet. When Moneypenny prepares one for you and Claude Code, it shows here.</div></sc-if>
<div class="list"><sc-for list="{{ mpv.handovers }}" as="h"><button class="row" key="{{ h.key }}" onClick="{{ h.open }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ h.name }}</span><span style="font-size: 13px; color: {{ h.mc }}">{{ h.meta }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div>
</sc-if>
