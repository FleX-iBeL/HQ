<sc-if value="{{ s.voices }}">
<sc-for list="{{ setv.voices }}" as="g"><div class="col" key="{{ g.key }}" style="gap: 8px"><div class="top" style="padding: 0 4px"><span class="face" style="width: 28px; height: 28px; background: {{ g.color }}; color: {{ g.ink }}; font-size: 12px">{{ g.initial }}</span><h2 class="h" style="font-size: 16px; letter-spacing: -0.01em">{{ g.name }}</h2></div><sc-if value="{{ g.hasCharacter }}"><span class="muted" style="font-size: 13px; line-height: 18px; margin: -2px 4px 0">{{ g.character }}</span></sc-if><div class="list"><sc-for list="{{ g.opts }}" as="o"><button class="row" key="{{ o.key }}" onClick="{{ o.pick }}"><span class="grow" style="font-size: 15px">{{ o.v }}</span><span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; box-sizing: border-box; border: {{ o.ring }}"></span></button></sc-for></div></div></sc-for>
</sc-if>
