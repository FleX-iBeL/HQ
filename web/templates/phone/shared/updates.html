<sc-if value="{{ s.updates }}">
<sc-if value="{{ mpv.updatesWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.updatesWord }}</span><sc-if value="{{ mpv.updatesFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<sc-if value="{{ mpv.hasUpdates }}">
<div class="list" style="max-height: 480px; overflow-y: auto"><sc-for list="{{ mpv.updates.versions }}" as="v"><div class="row" key="{{ v.key }}" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 700">{{ v.v }}</span><span style="font-size: 12px; font-weight: 600; color: {{ v.tc }}">{{ v.tag }}</span></span><span class="muted" style="font-size: 14px">{{ v.line }}</span></div></sc-for></div>
<span class="muted" style="font-size: 13px; margin: 0 4px">{{ mpv.updates.now }} {{ mpv.updates.said }}</span>
<sc-if value="{{ mpv.updates.idle }}"><sc-if value="{{ mpv.updates.available }}"><button class="pill" onClick="{{ mpv.updateBtn }}" style="background: #0f172a; color: #ffffff">{{ mpv.updates.label }}</button></sc-if><button class="pill" onClick="{{ mpv.checkNow }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ mpv.updates.checkLabel }}</button></sc-if>
<sc-if value="{{ mpv.updates.busy }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{ mpv.updates.step }}</span><span class="bar"><span style="display: block; width: 55%; height: 6px; background: #0f172a"></span></span></div></sc-if>
<sc-if value="{{ mpv.updates.done }}"><div style="padding: 12px 12px 12px 18px; border-radius: 18px; background: #f0fdf4; display: flex; align-items: center; gap: 10px"><span class="grow" style="font-size: 15px; font-weight: 600; color: #14532d">Update done</span><button class="small" onClick="{{ mpv.reloadPage }}" style="background: #ffffff">Reload</button></div></sc-if>
<sc-if value="{{ mpv.updates.failed }}"><div style="padding: 12px 12px 12px 18px; border-radius: 18px; background: #fef2f2; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; font-weight: 600; color: #7f1d1d">The update didn’t go through</span><span style="font-size: 13px; color: #7f1d1d">{{ mpv.updates.message }}</span></div></sc-if>
</sc-if>
</sc-if>
