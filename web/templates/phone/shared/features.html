<sc-if value="{{ s.features }}">
<span class="muted" style="font-size: 14px; margin: 0 4px">{{ setv.featCount }}</span>
<sc-if value="{{ setv.featWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ setv.featWord }}</span><sc-if value="{{ setv.featFailed }}"><button class="small" onClick="{{ setv.retryFeatures }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<div class="list"><sc-for list="{{ setv.features }}" as="f"><button class="row" key="{{ f.key }}" role="switch" aria-checked="{{ f.on }}" onClick="{{ f.toggle }}" style="opacity: {{ f.op }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ f.name }}</span><span class="muted" style="font-size: 13px">{{ f.line }}</span></span><span style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{ f.bg }}; display: flex; align-items: center; justify-content: {{ f.just }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button></sc-for></div>
<sc-if value="{{ setv.mapsKey }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px"><span class="lab">Maps key for driving</span><span class="muted" style="font-size: 13px">{{ setv.keyNote }}</span><div class="tbox"><label for="dk-key" class="sr">Paste the maps key</label><input id="dk-key" type="password" autocomplete="off" spellcheck="false" placeholder="{{ setv.keyHolder }}" value="{{ drafts.settingsMapsKey }}" onInput="{{ typed.settingsMapsKey }}" onKeyDown="{{ enter.settingsMapsKey }}"><button class="small" onClick="{{ setv.saveKey }}">{{ setv.keySave }}</button></div><sc-if value="{{ setv.hasKey }}"><button class="small" onClick="{{ setv.forgetKey }}" style="align-self: flex-start">Forget</button></sc-if><span class="muted" style="font-size: 12px">{{ setv.keySaid }}</span></div></sc-if>
</sc-if>
