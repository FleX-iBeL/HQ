<sc-if value="{{ s.sessions }}">
<sc-if value="{{ mpv.sessionWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.sessionWord }}</span></sc-if>
<sc-if value="{{ mpv.sessionEmpty }}"><div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><span class="h" style="font-size: 17px">{{ mpv.session.title }}</span><span class="muted" style="font-size: 14px">Nothing was recorded in this session.</span></div></sc-if>
<sc-if value="{{ mpv.hasSession }}"><div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><span class="top"><span class="h grow" style="font-size: 17px">{{ mpv.session.title }}</span><span class="muted" style="font-size: 13px">{{ mpv.session.count }}</span></span>
<sc-for list="{{ mpv.session.rows }}" as="r"><div class="col" key="{{ r.key }}" style="gap: 6px"><span style="display: flex; justify-content: space-between; gap: 10px; font-size: 13px"><span style="font-weight: 600">{{ r.name }}</span><span class="muted" style="flex-shrink: 0">{{ r.state }}</span></span><div style="display: flex; height: 14px; border-radius: 7px; background: #f8fafc"><div style="width: {{ r.start }}%; flex-shrink: 0"></div><div style="width: {{ r.w }}%; flex-shrink: 0; border-radius: 7px; background: {{ r.c }}; box-sizing: border-box; border: {{ r.border }}"></div></div></div></sc-for>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #64748b"><span>{{ mpv.session.axis.0 }}</span><span>{{ mpv.session.axis.1 }}</span><span>{{ mpv.session.axis.2 }}</span></div>
</div>
<sc-if value="{{ mpv.session.hasLog }}"><div class="list" style="max-height: 320px; overflow-y: auto"><sc-for list="{{ mpv.session.log }}" as="l"><div class="row" key="{{ l.key }}" style="cursor: default; align-items: flex-start"><span class="muted" style="font-size: 13px; width: 44px; flex-shrink: 0">{{ l.t }}</span><span class="grow" style="font-size: 14px; line-height: 20px">{{ l.text }}</span></div></sc-for></div></sc-if></sc-if>
<sc-if value="{{ mpv.daysWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.daysWord }}</span><sc-if value="{{ mpv.daysFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<div class="list" style="max-height: 420px; overflow-y: auto"><sc-for list="{{ mpv.days }}" as="d"><button class="row" key="{{ d.key }}" onClick="{{ d.pick }}"><span class="grow" style="font-size: 15px">{{ d.name }}</span><span class="muted" style="font-size: 13px">{{ d.meta }}</span></button></sc-for></div>
</sc-if>
