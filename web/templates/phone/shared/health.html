<sc-if value="{{ s.health }}">
<div class="list"><sc-for list="{{ routines }}" as="r"><div class="row" style="cursor: default"><span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: #16a34a"></span><span class="grow" style="font-size: 15px">{{ r.n }}</span><span class="muted" style="font-size: 13px">{{ r.l }}</span></div></sc-for></div>
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span class="lab">The laptop</span><span style="font-size: 15px">Cool · battery 82% · keeps working with the lid closed</span></div>
<h2 class="lab" style="margin: 0 4px">Incidents</h2>
<div class="list"><div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 600">Mail check stopped</span><span class="muted" style="font-size: 12px">Monday · 12 min</span></span><span class="muted" style="font-size: 13px; line-height: 18px">The mail server timed out. It restarted itself and caught up.</span></div><div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 600">Calendar sync was slow</span><span class="muted" style="font-size: 12px">Last week · 40 min</span></span><span class="muted" style="font-size: 13px; line-height: 18px">Google answered slowly. Nothing was lost.</span></div></div>
<button class="pill" onClick="{{ allOn }}" style="background: #0f172a; color: #ffffff">Turn everything on</button>
</sc-if>
