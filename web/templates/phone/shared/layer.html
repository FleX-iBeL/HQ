<sc-if value="{{ s.layer }}">
<div style="padding: 18px 20px; border-radius: 24px; background: #fff3ec; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #c2410c">In progress</span><span class="h" style="font-size: 22px">7 of 12 answered</span><span class="bar" style="background: #fde3d3"><span style="display: block; width: 58%; height: 6px; background: #c2410c"></span></span></div>
<div class="list"><sc-for list="{{ checklist }}" as="c"><div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top" style="align-items: flex-start"><span class="grow" style="font-size: 15px; font-weight: 600; line-height: 21px">{{ c.q }}</span><span style="font-size: 12px; font-weight: 700; color: {{ c.mc }}">{{ c.mark }}</span></span><sc-if value="{{ c.hasNote }}"><span class="muted" style="font-size: 13px; line-height: 18px">{{ c.note }}</span></sc-if></div></sc-for></div>
<button class="pill" onClick="{{ call.pepper }}" style="background: #c2410c; color: #ffffff">Continue with Pepper</button>
</sc-if>
