<sc-if value="{{ s.tutorial }}">
<span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">Everything in here is made up, so try anything.</span>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="pill grow" onClick="{{ demoCall.donna }}" style="background: #6d28d9; color: #fff">Demo {{ hv.donnaName }}</button><button class="pill grow" onClick="{{ demoCall.pepper }}" style="background: #c2410c; color: #fff">Demo {{ hv.pepperName }}</button><button class="pill grow" onClick="{{ demoCall.mp }}" style="background: #ca8a04; color: #0f172a">Demo {{ hv.mpName }}</button></div>
<sc-if value="{{ setv.tourWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ setv.tourWord }}</span></sc-if>
<div class="list"><sc-for list="{{ pieces }}" as="p"><button class="row" key="{{ p.key }}" onClick="{{ p.start }}"><span style="width: 24px; font-size: 13px; font-weight: 700; color: #475569; flex-shrink: 0">{{ p.n }}</span><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ p.t }}</span><sc-if value="{{ p.line }}"><span class="muted" style="font-size: 13px">{{ p.line }}</span></sc-if></span><sc-if value="{{ p.dot }}"><span aria-label="Not opened yet" style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: #6d28d9"></span></sc-if><span style="font-size: 13px; font-weight: 600; color: #15803d">{{ p.done }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div>
</sc-if>
