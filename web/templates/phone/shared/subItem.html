<sc-if value="{{ s.subItem }}">
<span class="muted" style="font-size: 13px">{{ listX.sub.crumb }}</span>
<div class="list"><sc-for list="{{ listX.sub.rows }}" as="r"><div class="row" style="cursor: default"><span class="grow muted" style="font-size: 14px">{{ r.k }}</span><span style="font-size: 15px; font-weight: {{ r.w }}">{{ r.v }}</span></div></sc-for></div>
<div class="list"><button class="row" onClick="{{ listX.sub.open }}" style="color: #475569; font-size: 14px">{{ listX.sub.under }}</button></div>
</sc-if>
