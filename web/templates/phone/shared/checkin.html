<sc-if value="{{ s.checkin }}">
<sc-if value="{{ pp.ck.note }}"><span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">{{ pp.ck.note }}</span></sc-if>
<sc-if value="{{ pp.ck.retryOn }}"><button class="pill" onClick="{{ pp.retry }}" style="align-self: flex-start; background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Try again</button></sc-if>
<sc-for list="{{ pp.ck.due }}" as="c"><div key="{{ c.key }}" style="display: flex; flex-direction: column; gap: 10px">
<div style="padding: 20px; border-radius: 24px; background: #fff3ec; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #c2410c">{{ c.kicker }}</span><span class="h" style="font-size: 24px">{{ c.title }}</span><span style="font-size: 15px; line-height: 22px">{{ c.sub }}</span><sc-for list="{{ c.score }}" as="x"><span class="muted" style="font-size: 13px; line-height: 18px">{{ x.t }}</span></sc-for></div>
<div style="display: flex; gap: 10px"><button class="pill grow" onClick="{{ c.start }}" style="background: #c2410c; color: #ffffff">Start now</button><button class="pill grow" onClick="{{ c.later }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Not now</button></div>
</div></sc-for>
<sc-if value="{{ pp.ck.hasKept }}"><span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">{{ pp.ck.keptLine }}</span></sc-if>
<sc-if value="{{ pp.ck.hasRest }}"><div class="list"><sc-for list="{{ pp.ck.rest }}" as="r"><div key="{{ r.key }}" class="row" style="cursor: default"><span class="grow" style="font-size: 15px">{{ r.title }}</span><span class="muted" style="font-size: 13px; text-align: right">{{ r.when }}</span></div></sc-for></div></sc-if>
</sc-if>
