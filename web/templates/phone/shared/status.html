<sc-if value="{{ s.status }}">
<div style="padding: 16px 18px; border-radius: 20px; background: {{ mpv.banner.bg }}; display: flex; align-items: center; gap: 10px"><span style="width: 10px; height: 10px; flex-shrink: 0; border-radius: 5px; background: {{ mpv.banner.dot }}"></span><span style="font-size: 15px; font-weight: 600; color: {{ mpv.banner.fg }}">{{ mpv.banner.t }}</span></div>
<sc-if value="{{ mpv.hasWho }}"><span class="muted" style="font-size: 14px; margin: -6px 4px 0">{{ mpv.who }}</span></sc-if>
<h2 class="lab" style="margin: 0 4px">Being worked on</h2>
<sc-if value="{{ mpv.statusWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.statusWord }}</span><sc-if value="{{ mpv.statusFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<sc-if value="{{ mpv.hasStatus }}"><div class="list">
<div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 8px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 600">{{ mpv.status.headline }}</span><span style="font-size: 13px; font-weight: 600; color: {{ mpv.status.c }}">{{ mpv.status.word }}</span></span><sc-if value="{{ mpv.status.hasSteps }}"><span class="bar"><span style="display: block; width: {{ mpv.status.pct }}%; height: 6px; background: #ca8a04"></span></span></sc-if><span class="muted" style="font-size: 13px">{{ mpv.status.phase }}</span></div>
<sc-for list="{{ mpv.status.notes }}" as="n"><div class="row" key="{{ n.key }}" style="cursor: default; flex-direction: column; align-items: stretch; gap: 2px"><span class="muted" style="font-size: 13px; font-weight: 600">{{ n.label }}</span><span style="font-size: 14px; line-height: 20px">{{ n.text }}</span></div></sc-for>
<sc-for list="{{ mpv.status.problems }}" as="p"><div class="row" key="{{ p.key }}" style="cursor: default"><span style="font-size: 14px; color: #b42318">{{ p.t }}</span></div></sc-for>
</div>
<sc-if value="{{ mpv.status.hasLog }}"><div class="list" style="max-height: 320px; overflow-y: auto"><sc-for list="{{ mpv.status.log }}" as="l"><div class="row" key="{{ l.key }}" style="cursor: default; align-items: flex-start"><span class="muted" style="font-size: 13px; width: 44px; flex-shrink: 0">{{ l.t }}</span><span class="grow" style="font-size: 14px; line-height: 20px">{{ l.text }}</span></div></sc-for></div></sc-if>
<span class="muted" style="font-size: 12px; margin: 0 4px">{{ mpv.status.updated }}</span></sc-if>
<h2 class="lab" style="margin: 0 4px">Usage</h2>
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; opacity: {{ mpv.usage.op }}">
<sc-for list="{{ mpv.usage.bars }}" as="u"><span class="col" key="{{ u.key }}" style="gap: 6px; opacity: {{ u.op }}"><span style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px"><span style="font-weight: 600">{{ u.name }}</span><span class="muted">{{ u.line }}</span></span><span class="bar"><span style="display: block; width: {{ u.w }}%; height: 6px; background: {{ u.c }}"></span></span></span></sc-for>
<sc-if value="{{ mpv.noBars }}"><span class="muted" style="font-size: 14px">{{ mpv.usageWord }}</span></sc-if>
<sc-if value="{{ mpv.hasRead }}"><span class="muted" style="font-size: 12px">{{ mpv.usage.read }}</span></sc-if>
</div>
<div class="list">
<button class="row" onClick="{{ nav.planning }}"><span class="grow" style="font-size: 15px; font-weight: 600">The planning board</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ nav.sessions }}"><span class="grow" style="font-size: 15px; font-weight: 600">Work sessions</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ nav.health }}"><span class="grow" style="font-size: 15px; font-weight: 600">Health</span><span class="muted" style="font-size: 13px">{{ mpv.healthSub }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ nav.updates }}"><span class="grow" style="font-size: 15px; font-weight: 600">Updates</span><span class="muted" style="font-size: 13px">{{ mpv.updateSub }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</sc-if>
