<sc-if value="{{ s.settings }}">
<!-- HQ: the Design rows switch the design in place (Spotlight / Thread / Desk), keeping where you are -->
<h2 class="lab" style="margin: 0 4px">Design</h2>
<div class="list"><sc-for list="{{ designs }}" as="d"><a class="row" role="radio" aria-checked="{{ d.on }}" href="{{ d.href }}" onClick="{{ d.pick }}" data-hq="design-switch" style="text-decoration: none"><span class="grow" style="font-size: 15px; font-weight: 600">{{ d.name }}</span><span style="width: 22px; height: 22px; border-radius: 11px; box-sizing: border-box; border: {{ d.ring }}; flex-shrink: 0"></span></a></sc-for></div>
<h2 class="lab" style="margin: 0 4px">Look</h2>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 22px; background: #e2e8f0"><sc-for list="{{ setv.looks }}" as="l"><button class="small" key="{{ l.key }}" onClick="{{ l.pick }}" style="background: {{ l.bg }}">{{ l.name }}</button></sc-for></div>
<h2 class="lab" style="margin: 0 4px">Voices</h2>
<div class="list"><sc-for list="{{ setv.voices }}" as="g"><div class="row" key="{{ g.key }}" style="cursor: default"><span class="face" style="width: 28px; height: 28px; background: {{ g.color }}; color: {{ g.ink }}; font-size: 12px">{{ g.initial }}</span><span class="grow" style="font-size: 15px">{{ g.name }}</span><span class="muted" style="font-size: 14px">{{ g.v }}</span></div></sc-for></div>
<div class="list">
<button class="row" onClick="{{ nav.features }}"><span class="grow" style="font-size: 15px; font-weight: 600">What HQ helps you with</span><span class="muted" style="font-size: 14px">{{ featCount }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ nav.sound }}"><span class="grow" style="font-size: 15px; font-weight: 600">Microphone and sound</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ nav.voices }}"><span class="grow" style="font-size: 15px; font-weight: 600">Change a voice</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ toggleFree }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">Free mode</span><span class="muted" style="font-size: 13px">Plain Claude, nothing of yours, nothing saved</span></span><span style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{ freeBg }}; display: flex; align-items: center; justify-content: {{ freeJust }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button>
</div>
<!-- HQ: for looking at states only, not part of the app: shown in demo mode (?demo=1) -->
<sc-if value="{{ demoMode }}">
<h2 class="lab" style="margin: 6px 4px 0">For the design review</h2>
<div class="list">
<button class="row" onClick="{{ toggleOffline }}"><span class="grow" style="font-size: 15px">HQ is offline</span><span style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{ offBg }}; display: flex; align-items: center; justify-content: {{ offJust }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button>
<button class="row" onClick="{{ toggleFresh }}"><span class="grow" style="font-size: 15px">A fresh install, nothing yet</span><span style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{ freshBg }}; display: flex; align-items: center; justify-content: {{ freshJust }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button>
<button class="row" onClick="{{ ringMe }}"><span class="grow" style="font-size: 15px">Donna calls you</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
</sc-if>
</sc-if>
