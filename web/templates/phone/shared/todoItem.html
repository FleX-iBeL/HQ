<sc-if value="{{ s.todoItem }}">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px"><span class="lab">{{ item.box }}</span><span class="h" style="font-size: 24px; text-decoration: {{ itemDeco }}">{{ item.title }}</span></div>
<div class="list">
<div class="row" style="cursor: default"><span class="grow muted" style="font-size: 14px">For</span><span style="font-size: 15px">You</span></div>
<div class="row" style="cursor: default"><span class="grow muted" style="font-size: 14px">Deadline</span><span style="font-size: 15px; color: {{ itemDeadC }}; font-weight: 600">{{ itemDead }}</span></div>
<button class="row" onClick="{{ sheetPlan }}"><span class="grow muted" style="font-size: 14px">In the calendar</span><span style="font-size: 15px">{{ plannedText }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
<button class="row" onClick="{{ sheetRepeat }}"><span class="grow muted" style="font-size: 14px">Comes back</span><span style="font-size: 15px">{{ repeatText }}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button class="pill" onClick="{{ tickItem }}" style="background: #dcfce7; color: #14532d">{{ tickLabel }}</button>
<button class="pill" onClick="{{ sheetPlan }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Plan it in</button>
<button class="pill" onClick="{{ sheetMove }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Move to a list</button>
<button class="pill" onClick="{{ letGo }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Let it go</button>
</div>
<button class="row card" onClick="{{ call.donna }}" style="border-radius: 20px"><span class="grow" style="font-size: 15px; font-weight: 600">Call Donna about this</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</sc-if>
