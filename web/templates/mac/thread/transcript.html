<sc-if value="{{ s.transcript }}">
<div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; background: {{ ca.tint }}">
<div class="top" style="padding: 52px 16px 12px">
<button class="iconbtn" aria-label="Back to the call" onClick="{{ back }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
<div class="grow col"><h1 class="h" style="font-size: 17px; letter-spacing: -0.01em">What was said</h1><span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: {{ ca.accent }}"><span style="width: 8px; height: 8px; border-radius: 4px; background: #d9392b"></span>Live · on a call with {{ ca.name }}</span></div>
<span class="face" style="width: 40px; height: 40px; background: {{ ca.color }}; color: {{ ca.ink }}; font-size: 16px">{{ ca.initial }}</span>
</div>
<div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 8px 22px 16px; display: flex; flex-direction: column; gap: 16px">
<span class="muted" style="font-size: 12px">Started 14:19 · this is the call, not your texts with {{ ca.name }}</span>
<sc-for list="{{ tLines }}" as="l"><div class="col" style="gap: 2px"><span style="font-size: 12px; font-weight: 700; color: {{ l.nc }}">{{ l.who }}</span><span style="font-size: {{ l.fs }}; line-height: 23px; color: {{ l.fc }}; font-weight: {{ l.fw }}; text-decoration: {{ l.deco }}">{{ l.t }}</span></div></sc-for>
<sc-if value="{{ askOpen }}">
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 15px; font-weight: 600">{{ ca.name }} asks: shall I move the gym to 20:00?</span><div style="display: flex; gap: 8px"><button class="pill grow" onClick="{{ sayYes }}" style="background: {{ ca.color }}; color: {{ ca.ink }}">Yes</button><button class="pill grow" onClick="{{ sayNo }}" style="background: #f1f5f9; color: #0f172a">No</button></div></div>
</sc-if>
</div>
<div style="padding: 10px 12px 30px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; flex-direction: column; gap: 10px">
<div class="tbox"><label for="dk-tr-text" class="sr">Type to {{ ca.name }} on the call</label><input id="dk-tr-text" placeholder="Type instead of talking"><button aria-label="Send to the call" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #0f172a; color: #ffffff"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
<div style="display: flex; gap: 8px"><button class="pill grow" onClick="{{ toggleMute }}" style="background: {{ muteBg }}; color: {{ muteFg }}; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ muteShort }}</button><button class="pill grow" onClick="{{ hangFromT }}" style="background: #d9392b; color: #ffffff">Hang up</button></div>
</div>
</div>
</sc-if>
