<sc-if value="{{ s.bucketItem }}">
<sc-if value="{{ listX.itemGone }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">{{ listX.itemGone }}</div></sc-if>
<sc-if value="{{ listX.itemHere }}">
<span class="muted" style="font-size: 13px">{{ listX.crumb }}</span>
<sc-if value="{{ listX.renamable }}"><div class="tbox" style="padding: 5px 16px"><label for="dk-bname" class="sr">Name</label><input id="dk-bname" maxlength="200" enterkeyhint="done" value="{{ listX.f.name }}" onChange="{{ listX.save.name }}" onKeyDown="{{ listX.blurOnEnter }}" style="font-weight: 600"></div></sc-if>
<sc-if value="{{ listX.hasSubs }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px"><span class="lab">With everything under it</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ listX.itemTotals }}" as="c"><span class="col"><span class="h" style="font-size: 18px">{{ c.v }}</span><span class="muted" style="font-size: 12px">{{ c.l }}</span></span></sc-for></div></div></sc-if>
<div class="list"><sc-for list="{{ subs }}" as="b"><div class="row" key="{{ b.id }}" style="cursor: default"><button aria-label="Tick {{ b.name }}" onClick="{{ b.toggle }}" style="width: 28px; height: 28px; padding: 0; border-radius: 14px; flex-shrink: 0; box-sizing: border-box; border: 2px solid {{ b.ring }}; background: {{ b.fill }}; cursor: pointer"></button><button onClick="{{ openSub }}" data-id="{{ b.id }}" class="grow col" style="border: none; background: transparent; padding: 0; text-align: left; font: inherit; color: #0f172a; cursor: pointer"><span style="font-size: 15px; font-weight: 600; text-decoration: {{ b.deco }}">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></button><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></div></sc-for><sc-if value="{{ listX.subFold }}"><button class="row" onClick="{{ listX.toggleClosed }}" aria-expanded="{{ listX.closedOpenAria }}" style="color: #475569; font-size: 14px">{{ listX.subFold }}</button></sc-if><sc-if value="{{ listX.subAddPlain }}"><div class="row" style="cursor: default; color: #475569; font-size: 14px">+ Add something under it</div></sc-if><sc-if value="{{ listX.subAddBox }}"><div class="row" style="cursor: default"><label for="dk-bsub" class="sr">Add something under it</label><input id="dk-bsub" maxlength="200" enterkeyhint="done" placeholder="+ Add something under it" value="{{ drafts.listSub }}" onInput="{{ typed.listSub }}" onKeyDown="{{ enter.listSub }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 14px Inter, sans-serif; color: #0f172a; padding: 0"></div></sc-if></div>
<sc-if value="{{ listX.ownFold }}"><button class="small" onClick="{{ listX.toggleOwn }}" aria-expanded="{{ listX.ownOpenAria }}" style="align-self: flex-start">{{ listX.ownFold }}</button></sc-if>
<sc-if value="{{ listX.ownOpen }}">
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 16px">
<div class="col" style="gap: 6px"><span class="lab">Kind</span><div style="display: flex; gap: 6px"><sc-for list="{{ listX.kindChips }}" as="k"><button class="chip" aria-pressed="{{ k.on }}" onClick="{{ k.pick }}" style="display: flex; align-items: center; background: {{ k.bg }}; color: {{ k.fg }}; box-shadow: {{ k.shadow }}">{{ k.name }}</button></sc-for></div></div>
<div class="col" style="gap: 6px"><span class="lab">Price</span><div class="tbox" style="padding: 5px 16px"><label for="dk-price" class="sr">Price</label><input id="dk-price" inputmode="decimal" placeholder="€0" value="{{ listX.f.price }}" onChange="{{ listX.save.price }}" onKeyDown="{{ listX.blurOnEnter }}"></div><div style="display: flex; gap: 6px"><sc-for list="{{ periodChips }}" as="p"><button class="chip" onClick="{{ p.pick }}" style="background: {{ p.bg }}; color: {{ p.fg }}; box-shadow: {{ p.shadow }}">{{ p.name }}</button></sc-for></div></div>
<div class="col" style="gap: 6px"><span class="lab">Time goal and hours</span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><div class="tbox" style="padding: 5px 16px"><label for="dk-goal" class="sr">Goal</label><input id="dk-goal" placeholder="2027, 2027-06 or 2027-06-14" value="{{ listX.f.by }}" onChange="{{ listX.save.by }}" onKeyDown="{{ listX.blurOnEnter }}"></div><div class="tbox" style="padding: 5px 16px"><label for="dk-hours" class="sr">Hours</label><input id="dk-hours" inputmode="decimal" placeholder="Hours" value="{{ listX.f.hours }}" onChange="{{ listX.save.hours }}" onKeyDown="{{ listX.blurOnEnter }}"></div></div></div>
<div class="col" style="gap: 6px"><span class="lab">How much it brings your vision closer</span><div style="display: flex; gap: 6px"><sc-for list="{{ scoreBtns }}" as="n"><button onClick="{{ n.pick }}" aria-label="Score {{ n.n }}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{ n.bg }}; color: {{ n.fg }}; box-shadow: 0 0 0 1px #e2e8f0 inset; font: 700 15px Sora, Inter, sans-serif; cursor: pointer">{{ n.n }}</button></sc-for></div><div class="tbox" style="padding: 5px 16px"><label for="dk-why" class="sr">Why</label><input id="dk-why" placeholder="Why that score" value="{{ listX.f.why }}" onChange="{{ listX.save.why }}" onKeyDown="{{ listX.blurOnEnter }}"></div></div>
<div class="col" style="gap: 6px"><span class="lab">Links</span><sc-for list="{{ linkRows }}" as="l"><div class="top"><a href="{{ l.href }}" target="_blank" rel="noopener noreferrer" class="grow" style="font-size: 14px; color: #6d28d9; text-decoration: none; overflow-wrap: anywhere">{{ l.t }}</a><button class="small" onClick="{{ l.remove }}">Remove</button></div></sc-for><div class="tbox" style="padding: 5px 16px"><label for="dk-link" class="sr">Add a link</label><input id="dk-link" inputmode="url" autocapitalize="off" placeholder="Paste a link" value="{{ drafts.listLink }}" onInput="{{ typed.listLink }}" onKeyDown="{{ enter.listLink }}"></div></div>
<div class="col" style="gap: 6px"><span class="lab">Notes</span><div class="tbox" style="padding: 5px 16px"><label for="dk-bnotes" class="sr">Notes</label><input id="dk-bnotes" placeholder="Anything else" value="{{ listX.f.notes }}" onChange="{{ listX.save.notes }}" onKeyDown="{{ listX.blurOnEnter }}"></div></div>
<span class="muted" style="font-size: 12px">Saves as you leave a field</span>
</div>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button class="pill" onClick="{{ listX.doneTap }}" style="background: #dcfce7; color: #14532d">{{ listX.doneLabel }}</button><sc-if value="{{ listX.canLetGo }}"><button class="pill" onClick="{{ listX.letGoTap }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Let go</button></sc-if><sc-if value="{{ listX.canMove }}"><button class="pill" onClick="{{ listX.moveUp }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Move up</button><button class="pill" onClick="{{ listX.moveDown }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Move down</button></sc-if></div>
<button class="pill" onClick="{{ delTap }}" style="background: {{ delBg }}; color: {{ delFg }}; box-shadow: 0 0 0 1px #fecaca inset">{{ delLabel }}</button>
</sc-if>
</sc-if>
