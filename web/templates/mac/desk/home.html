<sc-if value="{{ s.home }}">
<div style="flex-grow: 1; min-height: 0; padding: 0 40px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="flex-grow: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
<sc-for list="{{ homeCards }}" as="a">
<section class="card" style="display: flex; flex-direction: column; gap: 22px; padding: 28px">
<div class="top"><span class="face" style="width: 52px; height: 52px; background: {{ a.color }}; color: {{ a.ink }}; font-size: 20px">{{ a.initial }}</span><div class="grow col"><h2 class="h" style="font-size: 22px; letter-spacing: -0.02em">{{ a.name }}</h2><span class="muted" style="font-size: 13px">{{ a.role }}</span></div><button class="pill" onClick="{{ a.call }}" style="background: {{ a.color }}; color: {{ a.ink }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>Call</button></div>
<div class="col" style="gap: 4px"><span style="font-size: 13px; font-weight: 600; color: {{ a.accent }}">{{ a.kicker }}</span><span class="h" style="font-size: 28px; line-height: 34px">{{ a.headline }}</span><span class="muted" style="font-size: 15px">{{ a.sub }}</span></div>
<div class="col" style="gap: 12px; font-size: 15px"><sc-for list="{{ a.lines }}" as="l"><span style="color: {{ l.c }}; font-weight: {{ l.w }}">{{ l.t }}</span></sc-for></div>
<div style="flex-grow: 1"></div>
<button onClick="{{ a.open }}" style="align-self: flex-start; border: none; background: transparent; padding: 8px 0; font: 600 14px Inter, sans-serif; color: {{ a.accent }}; cursor: pointer">Open {{ a.name }}’s space</button>
</section>
</sc-for>
</div>
<section class="col" style="flex-shrink: 0; gap: 14px">
<div style="display: flex; align-items: baseline; gap: 12px"><h2 class="h" style="font-size: 20px; letter-spacing: -0.02em">Today</h2><span class="muted" style="font-size: 14px">Any time: renew your passport · pay the parking fine</span><div style="flex-grow: 1"></div><button onClick="{{ nav.agenda }}" style="border: none; background: transparent; font: 600 14px Inter, sans-serif; color: #6d28d9; cursor: pointer">Agenda</button></div>
<div style="display: flex; align-items: stretch; gap: 12px">
<sc-for list="{{ todayRow }}" as="t">
<sc-if value="{{ t.isNow }}"><div style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0 4px"><span style="padding: 3px 9px; border-radius: 10px; background: #0f172a; color: #ffffff; font-size: 12px; font-weight: 700">Now</span><span style="width: 2px; flex-grow: 1; background: #0f172a"></span></div></sc-if>
<sc-if value="{{ t.isItem }}"><button onClick="{{ t.open }}" style="flex: 1 1 0; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border: none; border-radius: 18px; background: {{ t.bg }}; box-shadow: {{ t.shadow }}; text-align: left; font: inherit; cursor: pointer"><span style="font-size: 13px; font-weight: 600; color: {{ t.tc }}">{{ t.time }}</span><span style="font-size: 15px; font-weight: 600; color: {{ t.fc }}">{{ t.longTitle }}</span></button></sc-if>
</sc-for>
</div>
</section>
<div class="tbox" style="flex-shrink: 0; padding-left: 8px">
<div role="radiogroup" aria-label="Text who" style="display: flex; gap: 4px"><sc-for list="{{ textChips }}" as="c"><button role="radio" aria-checked="{{ c.on }}" class="chip" onClick="{{ c.pick }}" style="height: 40px; border-radius: 20px; background: {{ c.bg }}; color: {{ c.fg }}">{{ c.name }}</button></sc-for></div>
<label for="dm-home-text" class="sr">Text {{ tt.name }}</label>
<input id="dm-home-text" placeholder="Text {{ tt.name }}, or hold space to talk">
<button aria-label="Send to {{ tt.name }}" onClick="{{ chat.textTo }}" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 22px; background: #0f172a; color: #ffffff; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</div>
</div>
</sc-if>
