<sc-if value="{{ s.chat }}">
<div class="top"><button class="iconbtn" aria-label="Back" onClick="{{ back }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><span class="face" style="width: 40px; height: 40px; background: {{ cha.color }}; color: {{ cha.ink }}; font-size: 16px">{{ cha.initial }}</span><div class="grow col" style="min-width: 0"><h1 class="h" style="font-size: 20px; letter-spacing: -0.02em">Texts with {{ cha.name }}</h1><span class="muted" style="font-size: 13px" data-oneline>{{ cha.role }}</span></div><sc-if value="{{ txSwapOn }}"><button class="small" onClick="{{ txSwap }}" aria-label="Switch to {{ txSwapName }}’s chat" style="display: flex; align-items: center; gap: 6px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 1l4 4-4 4"></path><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><path d="M7 23l-4-4 4-4"></path><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg>{{ txSwapName }}</button></sc-if><button class="pill" onClick="{{ call.chat }}" style="background: {{ cha.color }}; color: {{ cha.ink }}">Call</button></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; max-width: 760px">
<span style="align-self: center; padding: 4px 10px; border-radius: 10px; background: #f1f5f9; font-size: 12px; font-weight: 600; color: #475569">{{ txFirstDay }}</span>
<sc-for list="{{ bubbles }}" as="b"><sc-if value="{{ b.txPill }}"><span style="align-self: center; padding: 4px 10px; border-radius: 10px; background: #f1f5f9; font-size: 12px; font-weight: 600; color: #475569">{{ b.txPill }}</span></sc-if><sc-if value="{{ b.txText }}"><div style="align-self: {{ b.align }}; max-width: 440px; padding: 10px 14px; border-radius: {{ b.radius }}; background: {{ b.bg }}; color: {{ b.fg }}; font-size: 15px; line-height: 21px; white-space: pre-wrap; overflow-wrap: anywhere">{{ b.t }}</div></sc-if></sc-for>
<sc-if value="{{ txLineOn }}"><div style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0"><span class="muted" style="font-size: 14px">{{ txLine }}</span><sc-if value="{{ txReloadOn }}"><button class="small" onClick="{{ txReload }}">Try again</button></sc-if></div></sc-if>
<sc-for list="{{ txFailed }}" as="f"><div style="align-self: flex-end; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><div style="max-width: 440px; padding: 10px 14px; border-radius: 20px 20px 6px 20px; background: #dcfce7; color: #14532d; font-size: 15px; line-height: 21px; white-space: pre-wrap; overflow-wrap: anywhere">{{ f.t }}</div><button onClick="{{ f.retry }}" style="border: none; background: transparent; padding: 4px 0; font: 600 12px Inter, sans-serif; color: #b42318; cursor: pointer">Didn’t send · Try again</button></div></sc-for>
<div data-tx-end></div>
</div>
<div class="tbox" style="max-width: 760px; align-items: flex-end; position: sticky; bottom: 0; z-index: 1; box-shadow: 0 0 0 1px #e2e8f0 inset, 0 14px 0 14px #ffffff"><label for="dm-chat-text" class="sr">Text {{ cha.name }}</label><textarea id="dm-chat-text" rows="1" data-hq-grow="1" enterkeyhint="{{ txBox.hint }}" placeholder="Text {{ cha.name }}" value="{{ drafts.textsChat }}" onInput="{{ txBox.chat.typed }}" onKeyDown="{{ txBox.chat.key }}" ref="{{ txBox.grow }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 15px/22px Inter, sans-serif; color: #0f172a; padding: 9px 0; resize: none; overflow: hidden; box-sizing: border-box"></textarea><button aria-label="Send" onClick="{{ txSendChat }}" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 20px; background: #0f172a; color: #ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</sc-if>
