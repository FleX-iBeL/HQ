<sc-if value="{{ s.bucketItem }}">
<span class="muted" style="font-size: 13px">Bucketlist › Trip to Japan</span>
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px"><span class="lab">With everything under it</span><div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span class="col"><span class="h" style="font-size: 18px">€3,020</span><span class="muted" style="font-size: 12px">once</span></span><span class="col"><span class="h" style="font-size: 18px">€1,620</span><span class="muted" style="font-size: 12px">still to spend</span></span><span class="col"><span class="h" style="font-size: 18px">1 of 3</span><span class="muted" style="font-size: 12px">done</span></span></div></div>
<div class="list"><sc-for list="{{ subs }}" as="b"><div class="row" style="cursor: default"><button aria-label="Tick {{ b.name }}" onClick="{{ b.toggle }}" style="width: 28px; height: 28px; padding: 0; border-radius: 14px; flex-shrink: 0; box-sizing: border-box; border: 2px solid {{ b.ring }}; background: {{ b.fill }}; cursor: pointer"></button><button onClick="{{ openSub }}" class="grow col" style="border: none; background: transparent; padding: 0; text-align: left; font: inherit; color: #0f172a; cursor: pointer"><span style="font-size: 15px; font-weight: 600; text-decoration: {{ b.deco }}">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></button><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></div></sc-for><div class="row" style="cursor: default; color: #475569; font-size: 14px">+ Add something under it</div></div>
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 16px">
<div class="col" style="gap: 6px"><span class="lab">Kind</span><div style="display: flex; gap: 6px"><span class="chip" style="display: flex; align-items: center; background: #0f172a; color: #ffffff">Experience</span><span class="chip" style="display: flex; align-items: center; background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Product</span><span class="chip" style="display: flex; align-items: center; background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Service</span></div></div>
<div class="col" style="gap: 6px"><span class="lab">Price</span><div class="tbox" style="padding: 5px 16px"><label for="dk-price" class="sr">Price</label><input id="dk-price" value="€3,020"></div><div style="display: flex; gap: 6px"><sc-for list="{{ periodChips }}" as="p"><button class="chip" onClick="{{ p.pick }}" style="background: {{ p.bg }}; color: {{ p.fg }}; box-shadow: {{ p.shadow }}">{{ p.name }}</button></sc-for></div></div>
<div class="col" style="gap: 6px"><span class="lab">Time goal and hours</span><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><div class="tbox" style="padding: 5px 16px"><label for="dk-goal" class="sr">Goal</label><input id="dk-goal" value="Spring 2027"></div><div class="tbox" style="padding: 5px 16px"><label for="dk-hours" class="sr">Hours</label><input id="dk-hours" value="120 hours"></div></div></div>
<div class="col" style="gap: 6px"><span class="lab">How much it brings your vision closer</span><div style="display: flex; gap: 6px"><sc-for list="{{ scoreBtns }}" as="n"><button onClick="{{ n.pick }}" aria-label="Score {{ n.n }}" style="width: 44px; height: 44px; border: none; border-radius: 22px; background: {{ n.bg }}; color: {{ n.fg }}; box-shadow: 0 0 0 1px #e2e8f0 inset; font: 700 15px 'DM Sans', sans-serif; cursor: pointer">{{ n.n }}</button></sc-for></div><div class="tbox" style="padding: 5px 16px"><label for="dk-why" class="sr">Why</label><input id="dk-why" value="Slow travel, new food"></div></div>
<div class="col" style="gap: 6px"><span class="lab">Links</span><sc-for list="{{ linkRows }}" as="l"><div class="top"><a href="#" class="grow" style="font-size: 14px; color: #6d28d9; text-decoration: none">{{ l.t }}</a><button class="small" onClick="{{ l.remove }}">Remove</button></div></sc-for><div class="tbox" style="padding: 5px 16px"><label for="dk-link" class="sr">Add a link</label><input id="dk-link" placeholder="Paste a link"></div></div>
<div class="col" style="gap: 6px"><span class="lab">Notes</span><div class="tbox" style="padding: 5px 16px"><label for="dk-bnotes" class="sr">Notes</label><input id="dk-bnotes" placeholder="Anything else"></div></div>
<span class="muted" style="font-size: 12px">Saves as you leave a field</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button class="pill" style="background: #dcfce7; color: #14532d">Done</button><button class="pill" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Let go</button></div>
<button class="pill" onClick="{{ delTap }}" style="background: {{ delBg }}; color: {{ delFg }}; box-shadow: 0 0 0 1px #fecaca inset">{{ delLabel }}</button>
</sc-if>
