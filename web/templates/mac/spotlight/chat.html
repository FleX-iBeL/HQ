<sc-if value="{{ s.chat }}">
<div class="top"><button class="iconbtn" aria-label="Back" onClick="{{ back }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button><span class="face" style="width: 40px; height: 40px; background: {{ cha.color }}; color: {{ cha.ink }}; font-size: 16px">{{ cha.initial }}</span><div class="grow col"><h1 class="h" style="font-size: 20px; letter-spacing: -0.02em">Texts with {{ cha.name }}</h1><span class="muted" style="font-size: 13px">{{ cha.role }}</span></div><button class="pill" onClick="{{ call.chat }}" style="background: {{ cha.color }}; color: {{ cha.ink }}">Call</button></div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px; max-width: 760px">
<span style="align-self: center; padding: 4px 10px; border-radius: 10px; background: #f1f5f9; font-size: 12px; font-weight: 600; color: #475569">Texts · today</span>
<sc-for list="{{ bubbles }}" as="b"><div style="align-self: {{ b.align }}; max-width: 440px; padding: 10px 14px; border-radius: {{ b.radius }}; background: {{ b.bg }}; color: {{ b.fg }}; font-size: 15px; line-height: 21px">{{ b.t }}</div></sc-for>
</div>
<div class="tbox" style="max-width: 760px"><label for="dm-chat-text" class="sr">Text {{ cha.name }}</label><input id="dm-chat-text" placeholder="Text {{ cha.name }}"><button aria-label="Send" style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: none; border-radius: 20px; background: #0f172a; color: #ffffff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button></div>
</sc-if>
