<sc-if value="{{ s.layer }}">
<sc-if value="{{ pp.l.note }}"><span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">{{ pp.l.note }}</span></sc-if>
<sc-if value="{{ pp.l.retryOn }}"><button class="pill" onClick="{{ pp.retry }}" style="align-self: flex-start; background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Try again</button></sc-if>
<sc-if value="{{ pp.l.on }}">
<div style="padding: 18px 20px; border-radius: 24px; background: #fff3ec; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600; color: #c2410c">{{ pp.l.word }}</span><span class="h" style="font-size: 22px">{{ pp.l.headline }}</span><span class="bar" style="display: flex; background: #fde3d3"><span style="display: block; width: {{ pp.l.pct }}%; height: 6px; background: #c2410c"></span><span style="display: block; width: {{ pp.l.put }}%; height: 6px; background: #f6b48f"></span></span></div>
<div class="list"><sc-for list="{{ pp.l.items }}" as="c"><div key="{{ c.key }}" class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top" style="align-items: flex-start"><span class="grow" style="font-size: 15px; font-weight: 600; line-height: 21px">{{ c.q }}</span><span style="font-size: 12px; font-weight: 700; color: {{ c.mc }}">{{ c.mark }}</span></span><sc-if value="{{ c.hasNote }}"><span class="muted" style="font-size: 13px; line-height: 18px">{{ c.note }}</span></sc-if></div></sc-for><sc-if value="{{ pp.l.empty }}"><div class="row muted" style="cursor: default; font-size: 14px">No questions in this layer.</div></sc-if></div>
<button class="pill" onClick="{{ pp.l.start }}" style="background: #c2410c; color: #ffffff">{{ pp.l.startLabel }}</button>
</sc-if>
</sc-if>
