<sc-if value="{{ s.map }}">
<sc-if value="{{ pp.m.hasLayers }}"><span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">From the life you want in three to five years, down to this week. Tap a layer to work on it with Pepper.</span></sc-if>
<sc-if value="{{ pp.m.note }}"><span class="muted" style="font-size: 14px; line-height: 20px; margin: 0 4px">{{ pp.m.note }}</span></sc-if>
<sc-if value="{{ pp.m.retryOn }}"><button class="pill" onClick="{{ pp.retry }}" style="align-self: flex-start; background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Try again</button></sc-if>
<sc-if value="{{ pp.m.startOn }}"><button class="pill" onClick="{{ pp.m.start }}" style="background: #c2410c; color: #ffffff">Start the first session</button></sc-if>
<sc-if value="{{ pp.m.hasLayers }}"><div class="list"><sc-for list="{{ pp.m.layers }}" as="l"><button key="{{ l.key }}" class="row" onClick="{{ l.open }}" style="flex-direction: column; align-items: stretch; gap: 8px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 600">{{ l.name }}</span><span class="muted" style="font-size: 13px">{{ l.st }}</span></span><span class="bar" style="display: flex"><span style="display: block; width: {{ l.pct }}%; height: 6px; background: #c2410c"></span><span style="display: block; width: {{ l.put }}%; height: 6px; background: #f6b48f"></span></span></button></sc-for></div></sc-if>
</sc-if>
