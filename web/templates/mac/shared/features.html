<sc-if value="{{ s.features }}">
<span class="muted" style="font-size: 14px; margin: 0 4px">{{ featCount }}</span>
<div class="list"><sc-for list="{{ featRows }}" as="f"><button class="row" onClick="{{ f.toggle }}" style="opacity: {{ f.op }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ f.name }}</span><span class="muted" style="font-size: 13px">{{ f.line }}</span></span><span style="width: 48px; height: 28px; flex-shrink: 0; border-radius: 14px; background: {{ f.bg }}; display: flex; align-items: center; justify-content: {{ f.just }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button></sc-for></div>
<sc-if value="{{ mapsKey }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px"><span class="lab">Maps key for driving</span><div class="tbox"><label for="dk-key" class="sr">Paste the maps key</label><input id="dk-key" type="password" placeholder="Paste the key"><button class="small">Save</button></div><span class="muted" style="font-size: 12px">Once saved: Replace or Forget</span></div></sc-if>
</sc-if>
