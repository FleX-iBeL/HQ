<sc-if value="{{ s.sound }}">
<h2 class="lab" style="margin: 0 4px">Microphone</h2>
<div class="list"><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">iPhone microphone</span><span style="font-size: 13px; font-weight: 600; color: #15803d">In use</span></div><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">AirPods</span></div></div>
<h2 class="lab" style="margin: 0 4px">Her voice comes out of</h2>
<div class="list"><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">iPhone speaker</span><span style="font-size: 13px; font-weight: 600; color: #15803d">In use</span></div><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">AirPods</span></div></div>
<div class="list"><div class="row" style="cursor: default"><span class="grow col"><span style="font-size: 15px">Thinking sound</span><span class="muted" style="font-size: 13px">A soft tick while she thinks</span></span><span class="muted" style="font-size: 14px">On</span></div></div>
<span class="muted" style="font-size: 12px; margin: 0 4px">On an iPhone you can also switch these in Control Center.</span>
</sc-if>
