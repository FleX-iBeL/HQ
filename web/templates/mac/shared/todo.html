<sc-if value="{{ s.todo }}">
<div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 6px"><span class="lab">Commitments to others</span><span style="font-size: 15px">Send Alex the photos · Call the plumber back</span></div>
<sc-if value="{{ fresh }}"><div class="card" style="padding: 20px; font-size: 15px; line-height: 22px">Nothing on your list yet. Tell Donna what’s on your mind, on a call or in a text, and it gets sorted in here.</div></sc-if>
<sc-if value="{{ notFresh }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ boxes }}" as="b">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px; border-radius: 20px; background: #ffffff; box-shadow: {{ b.shadow }}; opacity: {{ b.op }}">
<button onClick="{{ b.openAll }}" class="top" style="border: none; background: transparent; padding: 0 0 4px; font: inherit; cursor: pointer; text-align: left"><span class="grow" style="font-size: 12px; font-weight: 700; color: #475569">{{ b.name }}</span><span style="font-family: var(--hq-display); font-size: 18px; font-weight: 700; color: {{ b.cc }}">{{ b.count }}</span></button>
<sc-for list="{{ b.items }}" as="i"><button onClick="{{ i.open }}" style="border: none; background: transparent; padding: 4px 0; text-align: left; font: 500 13px/18px Inter, sans-serif; color: #0f172a; cursor: pointer">{{ i.title }}</button></sc-for>
<button onClick="{{ b.openAll }}" style="border: none; background: transparent; padding: 4px 0; text-align: left; font: 600 12px Inter, sans-serif; color: #6d28d9; cursor: pointer">{{ b.more }}</button>
</div>
</sc-for>
</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><button class="chip" onClick="{{ lists.groceries }}" style="background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Groceries 6</button><button class="chip" onClick="{{ lists.bucket }}" style="background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Bucketlist 3</button><button class="chip" onClick="{{ lists.wish }}" style="background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Wishlist 2</button><button class="chip" onClick="{{ openDone }}" style="background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Done 6</button><button class="chip" onClick="{{ openLetgo }}" style="background: #ffffff; color: #475569; box-shadow: 0 0 0 1px #e2e8f0 inset">Let go 2</button></div>
<div class="tbox"><label for="dk-todo-add" class="sr">Add to your list</label><input id="dk-todo-add" placeholder="Add something, one per line"></div>
</sc-if>
