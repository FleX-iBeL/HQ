<sc-if value="{{ s.sessions }}">
<div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 12px"><span class="top"><span class="h grow" style="font-size: 17px">Today, 10:00 to now</span><span class="muted" style="font-size: 13px">2 of 3 done</span></span>
<sc-for list="{{ sessionRows }}" as="r"><div class="col" style="gap: 6px"><span style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 600">{{ r.name }}</span><span class="muted">{{ r.state }}</span></span><div style="display: flex; height: 14px; border-radius: 7px; background: #f8fafc"><div style="width: {{ r.start }}%"></div><div style="width: {{ r.w }}%; border-radius: 7px; background: {{ r.c }}; box-sizing: border-box; border: {{ r.border }}"></div></div></div></sc-for>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #64748b"><span>10:00</span><span>12:00</span><span>14:20</span></div>
</div>
<div class="list"><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">Tuesday</span><span class="muted" style="font-size: 13px">4 done</span></div><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">Monday</span><span class="muted" style="font-size: 13px">3 done, 1 found broken</span></div></div>
</sc-if>
