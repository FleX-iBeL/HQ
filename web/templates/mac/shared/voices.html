<sc-if value="{{ s.voices }}">
<sc-for list="{{ voiceGroups }}" as="g"><div class="col" style="gap: 8px"><div class="top" style="padding: 0 4px"><span class="face" style="width: 28px; height: 28px; background: {{ g.color }}; color: {{ g.ink }}; font-size: 12px">{{ g.initial }}</span><h2 class="h" style="font-size: 16px; letter-spacing: -0.01em">{{ g.name }}</h2></div><div class="list"><sc-for list="{{ g.opts }}" as="o"><button class="row" onClick="{{ o.pick }}"><span class="grow" style="font-size: 15px">{{ o.v }}</span><span style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 11px; box-sizing: border-box; border: {{ o.ring }}"></span></button></sc-for></div></div></sc-for>
</sc-if>
