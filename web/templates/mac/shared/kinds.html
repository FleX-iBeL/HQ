<sc-if value="{{ s.kinds }}">
<sc-for list="{{ kindRows }}" as="k"><div class="card" style="padding: 12px 14px; display: flex; flex-direction: column; gap: 10px"><div class="top"><span style="width: 14px; height: 14px; border-radius: 7px; background: {{ k.c }}; flex-shrink: 0"></span><div class="tbox grow" style="padding: 5px 14px"><label for="dk-kind-{{ $index }}" class="sr">Name</label><input id="dk-kind-{{ $index }}" value="{{ k.name }}" onInput="{{ k.typed }}"></div></div><div style="display: flex; gap: 5px; flex-wrap: wrap"><sc-for list="{{ k.swatches }}" as="w"><button aria-label="{{ w.name }}" onClick="{{ w.pick }}" style="width: 24px; height: 24px; flex-shrink: 0; padding: 0; border: none; border-radius: 12px; background: {{ w.c }}; box-shadow: {{ w.ring }}; cursor: pointer"></button></sc-for></div></div></sc-for>
<div style="display: flex; gap: 10px"><button class="pill grow" onClick="{{ saveKinds }}" style="background: #0f172a; color: #ffffff">Save</button><button class="pill grow" onClick="{{ resetKinds }}" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Back to the start</button></div>
</sc-if>
