<sc-if value="{{ s.appt }}">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #6d28d9">{{ appt.when }}</span><span class="h" style="font-size: 26px">{{ appt.title }}</span><span class="muted" style="font-size: 14px">{{ appt.where }}</span>
<sc-if value="{{ apptMarked }}"><span style="margin-top: 6px; font-size: 14px; font-weight: 600; color: {{ apptMarkColor }}">{{ apptMarkText }}</span></sc-if>
</div>
<div style="display: flex; gap: 10px"><button class="pill grow" onClick="{{ markDone }}" style="background: #dcfce7; color: #14532d">Done</button><button class="pill grow" onClick="{{ markMissed }}" style="background: #f1f5f9; color: #0f172a">Didn’t happen</button></div>
<sc-if value="{{ hasTravel }}"><div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 10px"><h2 class="h" style="font-size: 17px">Travel</h2><div style="display: flex; gap: 6px; flex-wrap: wrap"><sc-for list="{{ travelChips }}" as="t"><button class="chip" onClick="{{ t.pick }}" style="background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: {{ t.shadow }}">{{ t.name }}</button></sc-for></div><span style="font-size: 15px">{{ travelText }}</span><sc-if value="{{ hasTravelSub }}"><span class="muted" style="font-size: 13px">{{ travelSub }}</span></sc-if><sc-if value="{{ hasTravelLink }}"><a href="{{ travelLink }}" target="_blank" rel="noopener" style="font-size: 14px; font-weight: 600; color: #6d28d9; text-decoration: none">{{ travelLinkText }}</a></sc-if></div></sc-if>
<div class="list">
<sc-if value="{{ apptTimed }}"><button class="row" onClick="{{ toggleBell }}"><span class="grow" style="font-size: 15px; font-weight: 600">Text me when it starts</span><span style="width: 48px; height: 28px; border-radius: 14px; background: {{ bellBg }}; display: flex; align-items: center; justify-content: {{ bellJust }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button></sc-if>
<button class="row" onClick="{{ cl.aboutAppt }}"><span class="grow" style="font-size: 15px; font-weight: 600">Call {{ hv.donnaName }} about this</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button>
</div>
<sc-if value="{{ hasGoogle }}"><div class="card" style="padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span class="lab">From your calendar</span><span style="font-size: 14px; line-height: 20px; white-space: pre-wrap; overflow-wrap: anywhere">{{ apptGoogle }}</span></div></sc-if>
<h2 class="lab" style="margin: 0 4px">Your notes on it</h2>
<div class="list"><sc-for list="{{ apptNoteRows }}" as="n"><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px; overflow-wrap: anywhere">{{ n.t }}</span><button class="small" onClick="{{ n.clear }}">Clear</button></div></sc-for></div>
<div class="tbox"><label for="dk-appt-note" class="sr">Add a note</label><input id="dk-appt-note" placeholder="Add a quick note" value="{{ drafts.agendaApptNote }}" onInput="{{ typed.agendaApptNote }}" onKeyDown="{{ enter.agendaApptNote }}"></div>
</sc-if>
