<sc-if value="{{ s.weather }}">
<div class="card" style="padding: 20px; display: flex; flex-direction: column; gap: 4px"><span class="h" style="font-size: 48px; line-height: 52px">7°</span><span style="font-size: 15px">Cloudy · feels like 4° · wind 18 km/h from the south-west</span></div>
<div class="card" style="padding: 14px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; text-align: center"><sc-for list="{{ hours }}" as="h"><span class="col" style="gap: 4px"><span class="muted" style="font-size: 12px">{{ h.t }}</span><span style="font-family: var(--hq-display); font-weight: 700">{{ h.deg }}</span><span style="font-size: 12px; color: #1d4ed8; font-weight: 600">{{ h.rain }}</span></span></sc-for></div>
<div style="display: flex; gap: 6px"><sc-for list="{{ placeChips }}" as="p"><button class="chip" onClick="{{ p.pick }}" style="background: {{ p.bg }}; color: {{ p.fg }}; box-shadow: {{ p.shadow }}">{{ p.name }}</button></sc-for></div>
<div class="card" style="padding: 16px; display: flex; flex-direction: column; gap: 10px"><span class="top"><span class="lab grow">Rain radar · next 2 hours</span><span class="muted" style="font-size: 12px">16:00</span></span><div style="position: relative; height: 140px; border-radius: 16px; background: #eef2f7; overflow: hidden"><div style="position: absolute; left: 12%; top: 18%; width: 130px; height: 70px; border-radius: 50%; background: rgba(37,99,235,0.3)"></div><div style="position: absolute; left: 44%; top: 38%; width: 100px; height: 54px; border-radius: 50%; background: rgba(37,99,235,0.5)"></div><div style="position: absolute; left: 54%; top: 56%; width: 10px; height: 10px; border-radius: 5px; background: #0f172a; box-shadow: 0 0 0 4px #ffffff"></div></div></div>
<div class="card" style="padding: 14px 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><span class="col"><span class="muted" style="font-size: 12px">Sunrise</span><span style="font-size: 15px; font-weight: 600">08:21</span></span><span class="col"><span class="muted" style="font-size: 12px">Sunset</span><span style="font-size: 15px; font-weight: 600">16:36</span></span><span class="col"><span class="muted" style="font-size: 12px">UV</span><span style="font-size: 15px; font-weight: 600">1, low</span></span></div>
<div class="list"><div class="row" style="cursor: default"><span class="grow" style="font-size: 15px">No weather warnings</span></div><button class="row" onClick="{{ toggleRain }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">Rain alerts</span><span class="muted" style="font-size: 13px">Donna texts you when rain is coming</span></span><span style="width: 48px; height: 28px; border-radius: 14px; background: {{ rainBg }}; display: flex; align-items: center; justify-content: {{ rainJust }}; padding: 0 3px; box-sizing: border-box"><span style="width: 22px; height: 22px; border-radius: 11px; background: #ffffff"></span></span></button></div>
<span class="muted" style="font-size: 12px; text-align: center">From the national weather service, 5 minutes ago</span>
</sc-if>
