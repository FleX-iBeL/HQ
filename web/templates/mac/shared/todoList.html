<sc-if value="{{ s.todoList }}">
<sc-if value="{{ listOpen }}"><div role="group" aria-label="Show" style="display: flex; gap: 6px"><sc-for list="{{ todoFilters }}" as="f"><button class="chip" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="background: {{ f.bg }}; color: {{ f.fg }}; box-shadow: {{ f.shadow }}">{{ f.name }}</button></sc-for></div></sc-if>
<sc-if value="{{ todoX.listNote }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">{{ todoX.listNote }}</div></sc-if>
<sc-if value="{{ todoX.hasRows }}"><div class="list"><sc-for list="{{ todoRows }}" as="r"><div class="row" key="{{ r.id }}" data-id="{{ r.id }}" onPointerDown="{{ r.press }}" style="cursor: default; gap: 10px">
<sc-if value="{{ todoX.sortable }}"><span role="button" tabindex="0" aria-label="Change the order of {{ r.title }}: drag, or the arrow keys" onPointerDown="{{ r.grip }}" onKeyDown="{{ r.gripKey }}" style="display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 3px; box-sizing: border-box; width: 44px; height: 44px; margin: -8px -10px -8px -14px; flex-shrink: 0; cursor: grab; touch-action: none"><span style="width: 12px; height: 2px; background: #cbd5e1"></span><span style="width: 12px; height: 2px; background: #cbd5e1"></span><span style="width: 12px; height: 2px; background: #cbd5e1"></span></span></sc-if>
<button onClick="{{ r.open }}" class="grow col" style="border: none; background: transparent; padding: 0; text-align: left; font: inherit; color: #0f172a; cursor: pointer"><span style="font-size: 15px; font-weight: 600">{{ r.title }}</span><span style="font-size: 13px; color: {{ r.mc }}">{{ r.meta }}</span></button>
<sc-if value="{{ listOpen }}"><button aria-label="Tick off {{ r.title }}" onClick="{{ r.tick }}" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 14px; border: 2px solid #cbd5e1; background: transparent; cursor: pointer"></button></sc-if>
<sc-if value="{{ listClosed }}"><button class="small" onClick="{{ r.back }}">Back on a list</button></sc-if>
</div></sc-for></div></sc-if>
<sc-if value="{{ listOpen }}"><div class="tbox"><label for="dk-list-add" class="sr">Add to this list</label><textarea id="dk-list-add" rows="1" maxlength="2000" enterkeyhint="done" placeholder="Add several, one per line" value="{{ todoX.addDraft }}" onInput="{{ todoX.addInput }}" onKeyDown="{{ todoX.addKey }}" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font: 400 15px/22px Inter, sans-serif; color: #0f172a; padding: 8px 0; resize: none; overflow: hidden"></textarea></div><sc-if value="{{ todoX.sortable }}"><span class="muted" style="font-size: 12px; text-align: center">Drag the grip to reorder</span></sc-if></sc-if>
</sc-if>
