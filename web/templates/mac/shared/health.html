<sc-if value="{{ s.health }}">
<sc-if value="{{ mpv.healthWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.healthWord }}</span><sc-if value="{{ mpv.healthFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<sc-for list="{{ mpv.health.forYou }}" as="f"><span key="{{ f.key }}" style="font-size: 14px; margin: 0 4px">{{ f.t }}</span></sc-for>
<div class="list"><sc-for list="{{ mpv.health.rows }}" as="r"><div class="row" key="{{ r.key }}" style="cursor: default"><span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{ r.dot }}"></span><span style="font-size: 15px; flex-shrink: 0; max-width: 45%">{{ r.n }}</span><span class="muted grow" style="font-size: 13px; text-align: right">{{ r.l }}</span></div></sc-for></div>
<sc-if value="{{ mpv.health.hasLaptop }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 4px"><span class="lab">The laptop</span><span style="font-size: 15px">{{ mpv.health.laptop }}</span><sc-if value="{{ mpv.health.hasStats }}"><span class="muted" style="font-size: 13px">{{ mpv.health.stats }}</span></sc-if></div></sc-if>
<h2 class="lab" style="margin: 0 4px">Incidents</h2>
<sc-if value="{{ mpv.noIncidents }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.incidentsWord }}</span></sc-if>
<div class="list" style="max-height: 480px; overflow-y: auto"><sc-for list="{{ mpv.health.incidents }}" as="i"><div class="row" key="{{ i.key }}" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 600; color: {{ i.c }}">{{ i.name }}</span><span class="muted" style="font-size: 12px; flex-shrink: 0">{{ i.when }}</span></span><span class="muted" style="font-size: 13px; line-height: 18px">{{ i.why }}</span></div></sc-for></div>
<button class="pill" onClick="{{ mpv.turnOn }}" style="background: #0f172a; color: #ffffff">Turn everything on</button>
</sc-if>
