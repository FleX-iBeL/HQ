<sc-if value="{{ s.lists }}">
<div role="tablist" aria-label="Lists" style="display: flex; gap: 6px">
<sc-for list="{{ listTabs }}" as="t"><button role="tab" aria-selected="{{ t.on }}" class="chip" onClick="{{ t.pick }}" style="background: {{ t.bg }}; color: {{ t.fg }}; box-shadow: {{ t.shadow }}">{{ t.name }}</button></sc-for>
</div>
<hq-include name="groceries"></hq-include>
<sc-if value="{{ lt.bucket }}">
<sc-if value="{{ listX.note }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">{{ listX.note }}</div></sc-if>
<sc-if value="{{ listX.failed }}"><button class="small" onClick="{{ listX.retry }}" style="align-self: flex-start">Try again</button></sc-if>
<sc-if value="{{ listX.bucketTotalsOn }}"><div class="card" style="padding: 16px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ listX.bucketTotals }}" as="c"><span class="col"><span class="h" style="font-size: 18px">{{ c.v }}</span><span class="muted" style="font-size: 12px">{{ c.l }}</span></span></sc-for></div></sc-if>
<sc-if value="{{ listX.bucketEmpty }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">Nothing on your bucketlist yet. Things to live, get or do: add the first one below.</div></sc-if>
<sc-if value="{{ listX.bucketHasOpen }}"><div class="list"><sc-for list="{{ bucket }}" as="b"><button class="row" key="{{ b.id }}" onClick="{{ b.open }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div></sc-if>
<sc-if value="{{ listX.bucketFold }}"><button class="small" onClick="{{ listX.toggleClosed }}" aria-expanded="{{ listX.closedOpenAria }}" style="align-self: flex-start">{{ listX.bucketFold }}</button></sc-if>
<sc-if value="{{ listX.closedOpen }}"><sc-if value="{{ listX.bucketHasClosed }}"><div class="list"><sc-for list="{{ listX.bucketClosed }}" as="b"><button class="row" key="{{ b.id }}" onClick="{{ b.open }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600; color: #94a3b8; text-decoration: line-through">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div></sc-if></sc-if>
<!-- HQ: the add box the prototypes left out, in the style of the to-do list's -->
<div class="tbox"><label for="hq-bucket-add" class="sr">Add to your bucketlist</label><input id="hq-bucket-add" placeholder="Add to your bucketlist" maxlength="200" enterkeyhint="done" value="{{ drafts.bucket }}" onInput="{{ typed.bucket }}" onKeyDown="{{ enter.bucket }}"></div>
</sc-if>
<sc-if value="{{ lt.wish }}">
<sc-if value="{{ listX.note }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">{{ listX.note }}</div></sc-if>
<sc-if value="{{ listX.failed }}"><button class="small" onClick="{{ listX.retry }}" style="align-self: flex-start">Try again</button></sc-if>
<sc-if value="{{ listX.wishTotalsOn }}"><div class="card" style="padding: 16px 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px"><sc-for list="{{ listX.wishTotals }}" as="c"><span class="col"><span class="h" style="font-size: 18px">{{ c.v }}</span><span class="muted" style="font-size: 12px">{{ c.l }}</span></span></sc-for></div></sc-if>
<sc-if value="{{ listX.wishEmpty }}"><div class="card muted" style="padding: 16px 18px; font-size: 15px">Nothing on your wishlist yet.</div></sc-if>
<sc-if value="{{ listX.wishHasOpen }}"><div class="list"><sc-for list="{{ wish }}" as="b"><button class="row" key="{{ b.id }}" onClick="{{ b.open }}" style="cursor: {{ listX.wishCursor }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></span><sc-if value="{{ listX.wishOpens }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></sc-if></button></sc-for></div></sc-if>
<sc-if value="{{ listX.wishFold }}"><button class="small" onClick="{{ listX.toggleClosed }}" aria-expanded="{{ listX.closedOpenAria }}" style="align-self: flex-start">{{ listX.wishFold }}</button></sc-if>
<sc-if value="{{ listX.closedOpen }}"><sc-if value="{{ listX.wishHasClosed }}"><div class="list"><sc-for list="{{ listX.wishClosed }}" as="b"><button class="row" key="{{ b.id }}" onClick="{{ b.open }}"><span class="grow col"><span style="font-size: 15px; font-weight: 600; color: #94a3b8; text-decoration: line-through">{{ b.name }}</span><span class="muted" style="font-size: 13px">{{ b.meta }}</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></button></sc-for></div></sc-if></sc-if>
<!-- HQ: the add box the prototypes left out, in the style of the to-do list's -->
<div class="tbox"><label for="hq-wish-add" class="sr">Add to your wishlist</label><input id="hq-wish-add" placeholder="Add to your wishlist" maxlength="200" enterkeyhint="done" value="{{ drafts.wish }}" onInput="{{ typed.wish }}" onKeyDown="{{ enter.wish }}"></div>
</sc-if>
</sc-if>
