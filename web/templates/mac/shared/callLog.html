<sc-if value="{{ s.callLog }}">
<div class="card" style="padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; background: {{ sa.tint }}; box-shadow: none">
<span class="lab">Call transcript · {{ txLogLength }}</span>
<sc-if value="{{ txLogLineOn }}"><span class="muted" style="font-size: 14px">{{ txLogLine }}</span></sc-if>
<sc-for list="{{ logBubbles }}" as="l"><div class="col" style="gap: 2px"><span style="font-size: 12px; font-weight: 700; color: {{ l.nc }}">{{ l.who }}</span><span style="font-size: {{ l.fs }}; line-height: 23px; color: {{ l.fc }}; font-weight: {{ l.fw }}; text-decoration: {{ l.deco }}; white-space: pre-wrap; overflow-wrap: anywhere">{{ l.t }}</span></div></sc-for>
<div data-tx-end></div>
</div>
<button class="pill" onClick="{{ continueCall }}" style="background: {{ sa.color }}; color: {{ sa.ink }}">Continue this call with {{ sa.name }}</button>
</sc-if>
