<sc-if value="{{ s.updates }}">
<div class="list"><div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 700">v4.2</span><span style="font-size: 12px; font-weight: 600; color: #15803d">You’re here</span></span><span class="muted" style="font-size: 14px">Bucketlist items can hold items of their own.</span></div><div class="row" style="cursor: default; flex-direction: column; align-items: stretch; gap: 4px"><span class="top"><span class="grow" style="font-size: 15px; font-weight: 700">v4.3</span><span class="muted" style="font-size: 12px; font-weight: 600">Coming next</span></span><span class="muted" style="font-size: 14px">Calendar clean-up.</span></div></div>
<sc-if value="{{ updIdle }}"><button class="pill" onClick="{{ startUpdate }}" style="background: #0f172a; color: #ffffff">{{ updLabel }}</button><button class="pill" style="background: #ffffff; color: #0f172a; box-shadow: 0 0 0 1px #e2e8f0 inset">Check now</button></sc-if>
<sc-if value="{{ updBusy }}"><div class="card" style="padding: 16px 18px; display: flex; flex-direction: column; gap: 8px"><span style="font-size: 15px; font-weight: 600">{{ updLabel }}</span><span class="bar"><span style="display: block; width: 55%; height: 6px; background: #0f172a"></span></span></div></sc-if>
<sc-if value="{{ updDone }}"><div style="padding: 12px 12px 12px 18px; border-radius: 18px; background: #f0fdf4; display: flex; align-items: center; gap: 10px"><span class="grow" style="font-size: 15px; font-weight: 600; color: #14532d">Update done</span><button class="small" onClick="{{ reload }}" style="background: #ffffff">Reload</button></div></sc-if>
</sc-if>
