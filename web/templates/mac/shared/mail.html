<sc-if value="{{ s.mail }}">
<sc-for list="{{ mailItems }}" as="m"><div style="padding: 18px 20px; border-radius: 24px; background: #fef2f2; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 700; color: #b42318">Very important</span><span class="h" style="font-size: 20px; overflow-wrap: anywhere">{{ m.subject }}</span><span class="muted" style="font-size: 14px; overflow-wrap: anywhere">{{ m.from }}</span><span style="font-size: 14px; line-height: 20px; margin-top: 4px">{{ m.what }}</span><sc-if value="{{ m.onList }}"><span class="muted" style="font-size: 13px">It’s on your to-do list</span></sc-if></div></sc-for>
<sc-if value="{{ mailEmpty }}"><div class="card" style="padding: 16px 18px; font-size: 15px; line-height: 22px">No very important mail. Nothing needs you.</div></sc-if>
<sc-if value="{{ mailLoading }}"><span class="muted" style="font-size: 13px; text-align: center">Loading your mail…</span></sc-if>
<sc-if value="{{ mailFailed }}"><div class="top" style="padding: 0 4px"><span class="muted grow" style="font-size: 13px">Your mail didn’t load.</span><button class="small" onClick="{{ mailRetry }}" style="background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">Try again</button></div></sc-if>
<sc-if value="{{ mailRest }}"><div class="card" style="padding: 16px 18px; font-size: 15px; line-height: 22px">Everything else: 23 mails today, nothing that needs you.</div></sc-if>
</sc-if>
