<sc-if value="{{ s.planning }}">
<span class="muted" style="font-size: 14px; margin: 0 4px">To look at. You and Claude Code change it.</span>
<sc-if value="{{ mpv.hasPlanSearch }}"><div class="tbox"><label for="mp-plan-find" class="sr">Search the planning</label><input id="mp-plan-find" type="search" value="{{ drafts.mpFind }}" onInput="{{ mpv.findTyped }}" placeholder="Search by number or words" autocomplete="off"><sc-if value="{{ mpv.hasFind }}"><button class="small" onClick="{{ mpv.findClear }}">Clear</button></sc-if></div></sc-if>
<sc-if value="{{ mpv.planningWait }}"><span class="muted" style="font-size: 14px; margin: 0 4px">{{ mpv.planningWord }}</span><sc-if value="{{ mpv.planningFailed }}"><button class="small" onClick="{{ mpv.retry }}" style="align-self: flex-start">Try again</button></sc-if></sc-if>
<sc-if value="{{ mpv.planningEmpty }}"><div class="card" style="padding: 20px; font-size: 15px; line-height: 22px">Nothing on the planning right now.</div></sc-if>
<sc-if value="{{ mpv.planMore.none }}"><span class="muted" style="font-size: 14px; margin: 0 4px">Nothing on the planning fits that.</span></sc-if>
<sc-for list="{{ mpv.planning }}" as="p">
<div class="col" key="{{ p.key }}" style="gap: 8px"><h2 class="lab" style="margin: 0 4px">{{ p.phase }}</h2><div class="list"><sc-for list="{{ p.items }}" as="i"><div class="row" key="{{ i.key }}" style="cursor: default"><span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: {{ i.c }}"></span><span class="grow" style="font-size: 15px">{{ i.t }}</span><span class="muted" style="font-size: 13px; flex-shrink: 0">{{ i.s }}</span></div></sc-for></div></div>
</sc-for>
<sc-if value="{{ mpv.planMore.repeat.has }}"><div class="list"><button class="row" aria-expanded="{{ mpv.planMore.repeat.open }}" onClick="{{ mpv.foldRepeat }}"><span class="grow" style="font-size: 15px; font-weight: 600">{{ mpv.planMore.repeat.word }}</span><span class="muted" style="font-size: 18px; width: 16px; text-align: center">{{ mpv.planMore.repeat.arrow }}</span></button><sc-if value="{{ mpv.planMore.repeat.open }}"><sc-for list="{{ mpv.planMore.repeat.rows }}" as="i"><div class="row" key="{{ i.key }}" style="cursor: default"><span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: #2f7fd1"></span><span class="grow" style="font-size: 15px">{{ i.t }}</span><span class="muted" style="font-size: 13px; flex-shrink: 0">{{ i.s }}</span></div></sc-for></sc-if></div></sc-if>
<sc-if value="{{ mpv.planMore.done.has }}"><div class="list"><button class="row" aria-expanded="{{ mpv.planMore.done.open }}" onClick="{{ mpv.foldDone }}"><span class="grow" style="font-size: 15px; font-weight: 600">{{ mpv.planMore.done.word }}</span><span class="muted" style="font-size: 18px; width: 16px; text-align: center">{{ mpv.planMore.done.arrow }}</span></button><sc-if value="{{ mpv.planMore.done.open }}"><sc-for list="{{ mpv.planMore.done.groups }}" as="g"><div class="col" key="{{ g.key }}"><span class="lab" style="padding: 10px 18px 4px">{{ g.phase }}</span><sc-for list="{{ g.rows }}" as="i"><div class="row" key="{{ i.key }}" style="cursor: default"><span style="width: 10px; height: 10px; border-radius: 5px; flex-shrink: 0; background: #16a34a"></span><span class="grow" style="font-size: 15px">{{ i.t }}</span><span class="muted" style="font-size: 13px; flex-shrink: 0">{{ i.s }}</span></div></sc-for></div></sc-for><sc-if value="{{ mpv.planMore.done.more }}"><span class="muted" style="font-size: 13px; padding: 10px 18px">{{ mpv.planMore.done.more }}</span></sc-if></sc-if></div></sc-if>
</sc-if>
