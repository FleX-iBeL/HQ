<sc-if value="{{ s.agenda }}">
<div class="top" style="padding: 0 4px"><span class="muted grow" style="font-size: 13px">{{ agendaHead }}</span><button class="small" onClick="{{ nav.agendaFilter }}" style="background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">Filter</button></div>
<sc-if value="{{ agX.hasEarlier }}"><button class="small" onClick="{{ agX.toggleEarlier }}" aria-expanded="{{ agX.earlierAria }}" style="align-self: flex-start; background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">{{ agX.earlierLabel }}</button></sc-if>
<sc-if value="{{ agX.earlierOpen }}"><sc-for list="{{ agX.earlier }}" as="d">
<div class="col" style="gap: 8px"><h2 class="lab" style="margin: 0 4px">{{ d.day }}</h2>
<div class="list"><sc-for list="{{ d.items }}" as="i"><div class="row" key="{{ i.id }}" style="padding: 0; gap: 0; cursor: default"><button onClick="{{ i.open }}" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px 18px; padding-right: {{ i.padR }}; border: none; background: transparent; font: inherit; color: inherit; text-align: left; cursor: pointer"><span style="width: 44px; flex-shrink: 0; font-size: 14px; font-weight: 600; color: {{ i.tc }}">{{ i.t }}</span><span style="width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; background: {{ i.kind }}"></span><span class="grow col" style="min-width: 0; gap: 2px"><span style="font-size: 15px; color: {{ i.fc }}; text-decoration: {{ i.deco }}; overflow-wrap: anywhere">{{ i.title }}</span><sc-if value="{{ i.sub }}"><span class="muted" style="font-size: 12px; overflow-wrap: anywhere">{{ i.sub }}</span></sc-if><sc-if value="{{ i.notesLine }}"><span style="font-size: 12px; color: #0f172a; opacity: 0.8; white-space: pre-wrap; overflow-wrap: anywhere">{{ i.notesLine }}</span></sc-if></span><sc-if value="{{ i.ping }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6d28d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Texts you when it starts" style="flex-shrink: 0"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg></sc-if><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; display: {{ i.chev }}"><path d="M9 18l6-6-6-6"></path></svg></button><sc-if value="{{ i.marks }}"><div style="display: flex; gap: 6px; padding: 0 12px 0 0; flex-shrink: 0; opacity: {{ i.markOp }}"><button aria-label="{{ i.doneAria }}" aria-pressed="{{ i.doneOn }}" disabled="{{ i.noMark }}" onClick="{{ i.done }}" style="width: 32px; height: 32px; padding: 0; border-radius: 16px; box-sizing: border-box; border: 1.5px solid {{ i.doneRing }}; background: {{ i.doneBg }}; color: {{ i.doneFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button><button aria-label="{{ i.missAria }}" aria-pressed="{{ i.missOn }}" disabled="{{ i.noMark }}" onClick="{{ i.miss }}" style="width: 32px; height: 32px; padding: 0; border-radius: 16px; box-sizing: border-box; border: 1.5px solid {{ i.missRing }}; background: {{ i.missBg }}; color: {{ i.missFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button></div></sc-if></div></sc-for></div></div>
</sc-for></sc-if>

0; border-radius: 16px; box-sizing: border-box; border: 1.5px solid {{ i.doneRing }}; background: {{ i.doneBg }}; color: {{ i.doneFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button><button aria-label="{{ i.missAria }}" aria-pressed="{{ i.missOn }}" disabled="{{ i.noMark }}" onClick="{{ i.miss }}" style="width: 32px; height: 32px; padding: 0; border-radius: 16px; box-sizing: border-box; border: 1.5px solid {{ i.missRing }}; background: {{ i.missBg }}; color: {{ i.missFg }}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"></path></svg></button></div></sc-if></div></sc-for></div></div>
</sc-for>
<sc-if value="{{ agendaEmpty }}"><div class="card" style="padding: 16px 18px; font-size: 15px; line-height: 22px; color: #475569">{{ agendaEmptyText }}</div></sc-if>
<sc-if value="{{ agendaFailed }}"><div class="top" style="padding: 0 4px"><span class="muted grow" style="font-size: 13px">Your calendar didn’t load.</span><button class="small" onClick="{{ agendaRetry }}" style="background: #ffffff; box-shadow: 0 0 0 1px #e2e8f0 inset">Try again</button></div></sc-if>
<span class="muted" style="font-size: 12px; text-align: center">{{ agendaLooked }}</span>
</sc-if>
