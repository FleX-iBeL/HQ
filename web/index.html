<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8fafc">
<title>HQ</title>
<!-- Added to the Home Screen: a full-screen app of its own, named HQ. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HQ">
<meta name="application-name" content="HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
// Light or dark before anything draws, so opening HQ at night never flashes white: the pick
// kept on this device (hq-theme: 'light', 'dark', or nothing to follow the system), or
// ?theme=light|dark for testing. theme.js takes over from here.
(function () {
  var t = null;
  try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') { try { t = localStorage.getItem('hq-theme'); } catch (e) {} }
  if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  var bg = t === 'dark' ? '#0b1017' : '#f8fafc', root = document.documentElement;
  root.dataset.theme = t; root.style.background = bg;
  if (t === 'dark') root.style.colorScheme = 'dark';
  document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
})();
</script>
<link rel="stylesheet" href="css/theme.css">
<style>
  /* Before the design's stylesheets arrive: the system fonts the design falls back to. */
  html, body { margin: 0; background: var(--hq-ground, #f8fafc); color: var(--hq-ink, #0f172a); font-family: Inter, system-ui, sans-serif; }
</style>
<script type="module" src="boot.js"></script>
</head>
<body>
<div id="app"></div>
</body>
</html>
